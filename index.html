<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BEBU STREAMING ZONE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23e8133a'/><stop offset='100%25' stop-color='%23ff9f43'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text x='50' y='68' font-family='Arial Black,sans-serif' font-size='54' font-weight='900' text-anchor='middle' fill='white'>B</text></svg>"/>
<meta name="theme-color" content="#e8133a"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#08080e;--bg2:#0f0f1a;--bg3:#181826;--bg4:#22223a;
  --red:#e8133a;--orange:#ff5e3a;--gold:#fbbf24;
  --grad:linear-gradient(135deg,#e8133a,#ff5e3a 55%,#ff9f43);
  --txt:#f0f0ff;--txt2:rgba(240,240,255,.6);--txt3:rgba(240,240,255,.3);
  --brd:rgba(255,255,255,.07);
  --nav:64px;
  --ease:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--red);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ── NAV ── */
#nav{
  position:fixed;top:0;left:0;right:0;height:var(--nav);z-index:200;
  display:flex;align-items:center;padding:0 5%;gap:8px;
  transition:background .3s,border-color .3s;
}
#nav.solid{background:rgba(8,8,14,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--brd)}
.logo{
  font-family:'Bebas Neue',sans-serif;font-size:1.45rem;letter-spacing:.06em;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;cursor:pointer;flex-shrink:0;margin-right:4px;
}
.nav-links{display:flex;list-style:none;gap:2px}
.nav-links a{
  padding:6px 13px;border-radius:6px;font-size:.83rem;font-weight:500;
  color:var(--txt2);cursor:pointer;text-decoration:none;transition:all .2s;white-space:nowrap;
}
.nav-links a:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.nav-links a.on{color:var(--red);background:rgba(232,19,58,.09)}

/* search */
.srch-wrap{position:relative;margin-left:auto}
.srch-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--txt3);pointer-events:none}
#srch-inp{
  background:rgba(255,255,255,.07);border:1px solid var(--brd);border-radius:50px;
  padding:7px 14px 7px 35px;color:var(--txt);font-family:'Outfit',sans-serif;font-size:.82rem;
  width:195px;outline:none;transition:all .3s;
}
#srch-inp::placeholder{color:var(--txt3)}
#srch-inp:focus{width:250px;border-color:var(--red);background:rgba(232,19,58,.06);box-shadow:0 0 0 3px rgba(232,19,58,.1)}
#sdrop{
  position:absolute;top:calc(100% + 8px);right:0;width:300px;
  background:var(--bg2);border:1px solid var(--brd);border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.8);display:none;z-index:300;overflow:hidden;
}
#sdrop.show{display:block}
.sd-row{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--brd)}
.sd-row:last-child{border:none}
.sd-row:hover{background:rgba(232,19,58,.07)}
.sd-img{width:38px;height:55px;border-radius:5px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.sd-title{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-meta{font-size:.69rem;color:var(--txt2);margin-top:2px}
.sd-type{font-size:.6rem;padding:2px 6px;border-radius:3px;background:rgba(232,19,58,.15);color:var(--red);font-weight:700;flex-shrink:0}

.nav-hbg{display:none;background:none;border:none;color:var(--txt2);cursor:pointer;padding:8px;margin-left:auto}

/* ── MOBILE DRAWER ── */
#drawer{position:fixed;inset:0;z-index:190;display:none}
#drawer.open{display:block}
#drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
#drawer-panel{position:absolute;left:0;top:0;bottom:0;width:270px;background:var(--bg2);border-right:1px solid var(--brd);padding:20px 0;transform:translateX(-100%);transition:transform .3s var(--ease)}
#drawer.open #drawer-panel{transform:translateX(0)}
.drawer-logo{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;padding:0 20px 16px;border-bottom:1px solid var(--brd);display:block;margin-bottom:8px}
.drawer-link{display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--txt2);cursor:pointer;transition:all .18s;font-size:.9rem;font-weight:500}
.drawer-link:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.drawer-link.on{color:var(--red);background:rgba(232,19,58,.08)}

/* ── SCROLL TOP ── */
#s2t{position:fixed;bottom:24px;right:20px;z-index:150;width:42px;height:42px;border-radius:50%;background:var(--bg3);border:1px solid rgba(232,19,58,.3);color:var(--red);display:none;align-items:center;justify-content:center;cursor:pointer;transition:all .25s var(--spring);box-shadow:0 6px 20px rgba(0,0,0,.5)}
#s2t.show{display:flex}
#s2t:hover{background:var(--red);color:#fff;transform:translateY(-3px) scale(1.08)}

/* ── TRAILER MODAL ── */
#tmodal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center}
#tmodal.open{display:flex}
.tm-inner{position:relative;width:92%;max-width:940px;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 40px 80px rgba(0,0,0,.9)}
.tm-inner iframe{width:100%;height:100%;border:none}
.tm-cls{position:absolute;top:-46px;right:0;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.tm-cls:hover{background:var(--red)}

/* ── TOAST ── */
#toasts{position:fixed;bottom:22px;right:20px;z-index:500;display:flex;flex-direction:column;gap:7px}
.toast{display:flex;align-items:center;gap:8px;padding:10px 15px;background:var(--bg3);border:1px solid var(--brd);border-radius:10px;font-size:.82rem;box-shadow:0 6px 24px rgba(0,0,0,.65);animation:tIn .28s var(--ease);max-width:270px}
.toast.ok{border-color:#22c55e}.toast.err{border-color:var(--red)}
@keyframes tIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:none}}

/* ── MAIN ── */
#main{padding-top:var(--nav);min-height:100vh}

/* ── SPINNER ── */
.spin-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh}
.spinner{width:44px;height:44px;border:3px solid rgba(232,19,58,.15);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── HERO ── */
.hero{position:relative;height:86vh;min-height:480px;max-height:860px;overflow:hidden;background:#000}
.hero-img{position:absolute;inset:-2%;background-size:cover;background-position:center 20%;transform:scale(1.04);transition:background-image .8s ease,opacity .8s ease}
.hero-ovl{position:absolute;inset:0;background:linear-gradient(100deg,rgba(8,8,14,.97) 0%,rgba(8,8,14,.7) 40%,rgba(8,8,14,.25) 70%,rgba(8,8,14,.5) 100%),linear-gradient(to top,rgba(8,8,14,1) 0%,transparent 50%)}
.hero-edge{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad)}
.hero-content{position:relative;z-index:2;height:100%;display:flex;align-items:flex-end;padding:0 6% 90px;max-width:680px}
.hero-info{animation:hUp .65s var(--ease) both}
@keyframes hUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero-tag{display:inline-flex;align-items:center;gap:5px;background:var(--grad);color:#fff;font-size:.61rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:3px 10px;border-radius:4px;margin-bottom:13px}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.6rem,6.5vw,5rem);line-height:.93;letter-spacing:.02em;text-shadow:0 2px 30px rgba(0,0,0,.9);margin-bottom:12px}
.hero-stats{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:.82rem;color:var(--txt2)}
.hero-stats .gold{color:var(--gold);font-weight:700;display:flex;align-items:center;gap:4px}
.hero-desc{font-size:.86rem;color:var(--txt2);line-height:1.68;max-width:490px;margin-bottom:24px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-btns{display:flex;gap:11px;flex-wrap:wrap}
.hero-dots{position:absolute;bottom:36px;right:6%;z-index:2;display:flex;gap:7px}
.hdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:all .3s}
.hdot.on{background:var(--red);width:22px;border-radius:4px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:10px;font-family:'Outfit',sans-serif;font-size:.86rem;font-weight:600;cursor:pointer;border:none;text-decoration:none;white-space:nowrap;transition:all .24s var(--ease)}
.btn-red{background:var(--grad);color:#fff;box-shadow:0 4px 18px rgba(232,19,58,.35)}.btn-red:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(232,19,58,.5)}
.btn-dim{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px)}.btn-dim:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.btn-out{background:transparent;color:var(--txt2);border:1px solid rgba(255,255,255,.13)}.btn-out:hover{color:var(--txt);border-color:var(--red);background:rgba(232,19,58,.08)}
.btn-ico{padding:9px;border-radius:50%}
.btn-sm{padding:7px 16px;font-size:.79rem}

/* ── SECTIONS ── */
.section{padding:28px 5%}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-label{font-size:1.08rem;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-label::before{content:'';width:4px;height:20px;background:var(--grad);border-radius:2px;display:block;flex-shrink:0}
.sec-all{font-size:.79rem;color:var(--red);cursor:pointer;font-weight:600;display:flex;align-items:center;gap:2px;transition:opacity .18s}.sec-all:hover{opacity:.7}

/* ── ROW ── */
.row-wrap{position:relative}
.card-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.card-row::-webkit-scrollbar{display:none}
.row-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:10;background:rgba(8,8,14,.85);border:1px solid var(--brd);color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);transition:all .22s}
.row-btn:hover{background:var(--red);border-color:var(--red);transform:translateY(-50%) scale(1.1)}
.row-btn-l{left:-18px}.row-btn-r{right:-18px}

/* ── CARD ── */
.card{
  flex-shrink:0;width:155px;scroll-snap-align:start;
  border-radius:10px;overflow:hidden;cursor:pointer;position:relative;
  background:var(--bg3);
  transition:transform .3s var(--spring),box-shadow .3s;
  will-change:transform;
  isolation:isolate;
}
.card:hover{transform:scale(1.09) translateY(-8px);z-index:5;box-shadow:0 22px 52px rgba(0,0,0,.85)}
.card:hover .card-play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card:hover .card-ovl{opacity:1}
.card:hover .card-info{transform:none;opacity:1}
.card:hover .card-fav{opacity:1}
.card-img{width:100%;height:233px;object-fit:cover;display:block;background:var(--bg3)}
.card-ovl{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,14,.98) 0%,rgba(8,8,14,.45) 55%,transparent 100%);opacity:.6;transition:opacity .28s}
.card-play{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) scale(.65);width:46px;height:46px;border-radius:50%;background:rgba(232,19,58,.9);display:flex;align-items:center;justify-content:center;opacity:0;transition:all .28s var(--spring);box-shadow:0 0 0 8px rgba(232,19,58,.15)}
.card-info{position:absolute;bottom:0;left:0;right:0;padding:9px 8px;transform:translateY(4px);opacity:.88;transition:all .25s}
.card-name{font-size:.73rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.card-meta{display:flex;justify-content:space-between;align-items:center}
.card-rat{display:flex;align-items:center;gap:3px;font-size:.67rem;color:var(--gold);font-weight:700}
.card-yr{font-size:.65rem;color:var(--txt3)}

/* LEFT column: FILM/TV badge top, quality badge below it */
.card-badge{
  position:absolute;top:6px;left:6px;
  background:var(--grad);color:#fff;
  font-size:.52rem;font-weight:800;text-transform:uppercase;
  padding:2px 6px;border-radius:3px;letter-spacing:.07em;
  pointer-events:none;z-index:3;
}
.card-qual-wrap{
  position:absolute;top:26px;left:6px;
  display:flex;flex-direction:column;gap:3px;
  pointer-events:none;z-index:3;
}
/* RIGHT: fav button only — alone, no overlap */
.card-fav{
  position:absolute;top:6px;right:6px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.62);border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;pointer-events:auto;
  opacity:0;transition:opacity .22s,background .22s;
  backdrop-filter:blur(4px);z-index:3;
}
.card-fav.saved{color:var(--red);opacity:1!important}
.card-fav:hover{background:rgba(232,19,58,.62)}
.card-prog{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08)}
.card-prog-fill{height:100%;background:var(--grad)}

/* wide card */
.card-wide{width:230px}
.card-wide .card-img{height:132px}

/* top-10 */
.t10-wrap{display:flex;align-items:flex-end;flex-shrink:0;width:185px;scroll-snap-align:start;cursor:pointer}
.t10-num{font-family:'Bebas Neue',sans-serif;font-size:5.5rem;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(240,240,255,.16);user-select:none;flex-shrink:0;width:58px;text-align:right}
.t10-card{width:120px;flex-shrink:0;border-radius:10px;overflow:hidden;position:relative;background:var(--bg3);transition:transform .3s var(--spring),box-shadow .3s}
.t10-wrap:hover .t10-card{transform:scale(1.07) translateY(-5px);z-index:5;box-shadow:0 18px 45px rgba(0,0,0,.8)}
.t10-img{width:100%;height:180px;object-fit:cover;display:block;background:var(--bg3)}
.t10-ovl{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,14,.95) 0%,transparent 65%);opacity:.7}
.t10-info{position:absolute;bottom:0;left:0;right:0;padding:7px 7px}
.t10-name{font-size:.7rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t10-rat{font-size:.64rem;color:var(--gold);display:flex;align-items:center;gap:2px;margin-top:2px}

/* ── SKELETON ── */
.skel{background:linear-gradient(90deg,var(--bg3) 0%,rgba(48,48,72,.9) 50%,var(--bg3) 100%);background-size:200%;animation:shimmer 1.5s infinite;border-radius:10px}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:14px}
.grid .card{width:auto}
.grid .card-img{height:214px}

/* ── PAGE HEADER ── */
.pg-hd{padding:52px 6% 20px}
.pg-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,4vw,3rem);letter-spacing:.025em;margin-bottom:5px}
.pg-sub{font-size:.85rem;color:var(--txt2)}

/* ── FILTER PILLS ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 6% 22px}
.fpill{padding:6px 16px;border-radius:50px;font-size:.78rem;font-weight:600;cursor:pointer;background:var(--bg3);border:1px solid var(--brd);color:var(--txt2);transition:all .2s}
.fpill:hover,.fpill.on{background:rgba(232,19,58,.13);border-color:rgba(232,19,58,.4);color:var(--red)}

/* ── DETAIL ── */
.det-hero{position:relative;height:58vh;min-height:320px;max-height:640px;overflow:hidden}
.det-hero img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.det-hero-ovl{position:absolute;inset:0;background:linear-gradient(to right,rgba(8,8,14,.98),rgba(8,8,14,.65) 45%,rgba(8,8,14,.3)),linear-gradient(to top,rgba(8,8,14,1) 0%,transparent 50%)}
/* Back button floats over the hero */
.det-back{position:absolute;top:calc(var(--nav) + 14px);left:6%;z-index:10;display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:8px;font-size:.8rem;font-weight:600;background:rgba(8,8,14,.7);border:1px solid rgba(255,255,255,.18);color:var(--txt);cursor:pointer;transition:all .2s;backdrop-filter:blur(8px)}
.det-back:hover,.det-back:focus-visible{background:var(--red);border-color:var(--red);color:#fff;outline:none}
.det-body{position:relative;padding:0 6%;max-width:1440px;margin:0 auto}
.det-grid{display:grid;grid-template-columns:175px 1fr;gap:34px;align-items:start;margin-top:-170px;position:relative}
.det-poster{width:175px;border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.9);aspect-ratio:2/3;object-fit:cover;border:1px solid rgba(255,255,255,.08)}
.det-genres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.genre-pill{padding:3px 10px;border-radius:50px;font-size:.68rem;color:var(--red);font-weight:700;border:1px solid rgba(232,19,58,.28);background:rgba(232,19,58,.1)}
.det-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,4.5vw,3.8rem);line-height:.94;letter-spacing:.02em;margin-bottom:8px}
.det-tagline{font-size:.83rem;color:var(--txt2);font-style:italic;margin-bottom:12px}
.det-meta{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:16px;font-size:.82rem}
.det-mi{display:flex;align-items:center;gap:7px}
.det-mi-label{font-size:.63rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:1px}
.det-mi-val{font-weight:500}
.rating-ring{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:700;color:var(--gold);flex-shrink:0;box-shadow:0 0 0 4px rgba(251,191,36,.1)}
.det-overview{font-size:.85rem;color:var(--txt2);line-height:1.72;max-width:700px;margin-bottom:24px}
.det-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.det-crew{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:24px}
.crew-block .crew-lbl{font-size:.63rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em}
.crew-block .crew-val{font-size:.82rem;font-weight:600;margin-top:2px}

/* ── CAST ROW ── */
.cast-scroll{display:flex;gap:13px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cast-scroll::-webkit-scrollbar{display:none}
.cast-card{flex-shrink:0;width:82px;text-align:center;cursor:pointer}
.cast-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--bg3);margin:0 auto 5px;border:2px solid var(--brd);transition:border-color .2s,transform .2s}
.cast-card:hover .cast-photo{border-color:var(--red);transform:scale(1.07)}
.cast-name{font-size:.67rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cast-char{font-size:.6rem;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── EPISODES ── */
.ep-section{padding:24px 5%}
.season-tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:16px}
.season-tabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:6px 17px;border-radius:50px;font-size:.78rem;font-weight:600;cursor:pointer;background:var(--bg3);border:1px solid var(--brd);color:var(--txt2);transition:all .2s}
.stab.on,.stab:hover{background:var(--red);border-color:var(--red);color:#fff}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:10px}
.ep-card{display:flex;gap:11px;align-items:center;background:var(--bg3);border:1px solid var(--brd);border-radius:10px;padding:11px;cursor:pointer;transition:all .2s}
.ep-card:hover,.ep-card.playing{border-color:var(--red);background:rgba(232,19,58,.07)}
.ep-thumb{width:92px;height:54px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg2)}
.ep-num{font-size:.63rem;color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.ep-name{font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-desc{font-size:.68rem;color:var(--txt3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── WATCH PAGE ── */
.watch-bar{display:flex;align-items:center;gap:14px;padding:13px 5%;border-bottom:1px solid var(--brd)}
.watch-title{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;letter-spacing:.03em}
.watch-sub{font-size:.75rem;color:var(--txt2)}
.player-outer{background:#000;position:relative;padding-bottom:56.25%;height:0}
.player-outer iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.watch-info{padding:24px 5%;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}

/* ── GENRE GRID ── */
.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px;padding:0 6% 28px}
.genre-chip{background:var(--bg3);border:1px solid var(--brd);border-radius:12px;padding:20px 15px;cursor:pointer;transition:all .24s;position:relative;overflow:hidden}
.genre-chip::before{content:'';position:absolute;inset:0;background:var(--grad);opacity:0;transition:opacity .28s}
.genre-chip:hover{border-color:rgba(232,19,58,.38);transform:translateY(-3px)}
.genre-chip:hover::before{opacity:.1}
.genre-ico{font-size:1.75rem;margin-bottom:6px;display:block;position:relative;z-index:1}
.genre-name{font-size:.86rem;font-weight:700;position:relative;z-index:1}
.genre-type{font-size:.7rem;color:var(--txt3);position:relative;z-index:1}

/* ── EMPTY / ERROR ── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center}
.empty-state .ico{font-size:3.4rem;margin-bottom:14px;opacity:.4}
.empty-state h3{font-size:1.1rem;font-weight:700;margin-bottom:6px}
.empty-state p{font-size:.84rem;color:var(--txt2);max-width:300px}

/* ── FOOTER ── */
footer{padding:52px 6% 36px;border-top:1px solid var(--brd);margin-top:56px}
.ft-logo{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ft-by{font-size:.78rem;color:var(--txt3);margin-bottom:22px}
.ft-nav{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.ft-nav a{font-size:.78rem;color:var(--txt2);cursor:pointer;transition:color .18s;text-decoration:none}.ft-nav a:hover{color:var(--red)}
.ft-copy{font-size:.68rem;color:var(--txt3);line-height:1.62;max-width:680px}

/* ── ANIM ── */
.fade-in{animation:fadeIn .32s var(--ease) both}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

<!-- toast container -->

      <input id="drawer-srch" type="text" placeholder="Search movies, shows…" autocomplete="off"
        onkeydown="if(event.key==='Enter'){go('search',{query:this.value.trim()});closeDrawer()}"/>

  <div class="srch-wrap">

  </button>
</nav>

<!-- page content -->
<main id="main"></main>

<script>
'use strict';

/* ═══════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════ */
const KEY  = '34d1a1bd431dc14e9243d534340f360b';
const BASE = 'https://api.themoviedb.org/3';
const IMGB = 'https://image.tmdb.org/t/p';
const VK   = 'https://www.vidking.net/embed';
const VCOL = 'e8133a';

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
const ST = {
  page: 'home',
  id: null, mediaType: null,
  season: 1, ep: 1,
  query: '',
  genre: null, genreName: '',
  _navStack: [],   // full history stack — each entry is a complete state snapshot
  favIds: new Set(lsGet('bsz-fids', [])),
  favData: lsGet('bsz-fdat', []),
  recent:  lsGet('bsz-rec',  []),
  progress: lsGet('bsz-prog', {}),
  hero: { items:[], idx:0, timer:null, paused:false },
  movCat:'popular', movPage:1, movItems:[], movLoading:false,
  tvCat:'popular',  tvPage:1,  tvItems:[],  tvLoading:false,
};

/* ═══════════════════════════════════════════════
   LOCAL STORAGE
═══════════════════════════════════════════════ */
function lsGet(k, def) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
}

/* ═══════════════════════════════════════════════
   API CACHE
═══════════════════════════════════════════════ */
const CACHE = new Map();
async function api(path, params = {}) {
  const url = new URL(BASE + path);
  url.searchParams.set('api_key', KEY);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const key = url.toString();
  if (CACHE.has(key)) return CACHE.get(key);
  const res = await fetch(url);
  if (!res.ok) throw new Error('API ' + res.status);
  const data = await res.json();
  if (CACHE.size > 250) CACHE.delete(CACHE.keys().next().value);
  CACHE.set(key, data);
  return data;
}

const A = {
  trending: (t='all', w='week') => api(`/trending/${t}/${w}`),
  popular:  (t, pg=1) => api(`/${t}/popular`, {page:pg}),
  topRated: (t, pg=1) => api(`/${t}/top_rated`, {page:pg}),
  nowPlay:  (pg=1)    => api('/movie/now_playing', {page:pg}),
  upcoming: (pg=1)    => api('/movie/upcoming', {page:pg}),
  onAir:    (pg=1)    => api('/tv/on_the_air', {page:pg}),
  airToday: (pg=1)    => api('/tv/airing_today', {page:pg}),
  search:   (q, pg=1) => api('/search/multi', {query:q, page:pg}),
  detail:   (id, t)   => api(`/${t}/${id}`, {append_to_response:'credits,videos,similar,recommendations'}),
  season:   (id, s)   => api(`/tv/${id}/season/${s}`),
  byGenre:  (t, gid, pg=1) => api(`/discover/${t}`, {with_genres:gid, sort_by:'popularity.desc', page:pg}),
  genres:   (t)       => api(`/genre/${t}/list`),
  paged:    (t, cat, pg=1) => api(`/${t}/${cat}`, {page:pg}),
};

/* ═══════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════ */
const title = i => i?.title || i?.name || 'Untitled';
const date  = i => i?.release_date || i?.first_air_date || '';
const mtype = i => i?.media_type || (i?.title ? 'movie' : 'tv');
const year  = d => d ? new Date(d).getFullYear() : '';
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'}) : '';
const rating  = r => r ? (+r).toFixed(1) : 'N/A';
const runtime = m => !m ? '' : Math.floor(m/60) > 0 ? `${Math.floor(m/60)}h ${m%60}m` : `${m}m`;

  poster: (p, sz='w342') => p ? `${IMGB}/${sz}${p}` : `https://placehold.co/342x513/181826/555?text=No+Image`,

/* item registry - avoids stringify of complex objects in onclick */
const REG = new Map();
function regItem(item) {
  const t = mtype(item);
  const stored = { ...item, _mtype: t };
  REG.set(item.id, stored);
  return stored;
}
function getItem(id) { return REG.get(+id); }

/* favorites */
function isFav(id) { return ST.favIds.has(+id); }
function toggleFav(id) {
  id = +id;
  const item = getItem(id);
  if (!item) return;
  const removing = isFav(id);

  if (removing) {
    ST.favIds.delete(id);
    ST.favData = ST.favData.filter(f => f.id !== id);
    toast('Removed from Watchlist');
  } else {
    ST.favIds.add(id);
    ST.favData.unshift(item);
    toast('Added to Watchlist ❤️', 'ok');
  }
  lsSet('bsz-fids', [...ST.favIds]);
  lsSet('bsz-fdat', ST.favData);

  // ── Real-time: update every fav button with this id ──
  document.querySelectorAll(`[data-fid="${id}"]`).forEach(btn => {
    btn.classList.toggle('saved', isFav(id));
    btn.innerHTML = isFav(id) ? SVG.bmSolid : SVG.bm;
  });

  // ── Real-time: if on Favorites page, remove card from grid immediately ──
  if (ST.page === 'favorites' && removing) {
    const card = document.querySelector(`[data-card-id="${id}"]`);
    if (card) {
      card.style.transition = 'opacity .25s,transform .25s';
      card.style.opacity = '0';
      card.style.transform = 'scale(.85)';
      setTimeout(() => {
        card.remove();
        // Update subtitle count
        const sub = document.querySelector('#main .pg-sub');
        if (sub) sub.textContent = `${ST.favData.length} title${ST.favData.length !== 1 ? 's' : ''} saved`;
        // Show empty state if grid is empty
        const grid = document.querySelector('#main .grid');
        if (grid && grid.children.length === 0) {
          grid.innerHTML = emptyState('🎬', 'Watchlist Empty', 'Add titles by clicking the bookmark icon on any card');
          const moreWrap = document.querySelector('#main .grid + div');
          if (moreWrap) moreWrap.remove();
        }
      }, 280);
    }
  }
}
window.toggleFav = toggleFav;

/* recently viewed */
function addRecent(item) {
  ST.recent = ST.recent.filter(r => r.id !== item.id);
  ST.recent.unshift(item);
  if (ST.recent.length > 24) ST.recent.pop();
  lsSet('bsz-rec', ST.recent);
}

/* progress */
function getProgress(id) { return ST.progress[id] || null; }
function saveProgress(id, type, pct, s, ep) {
  ST.progress[id] = { type, pct: Math.min(pct, 100), s, ep, ts: Date.now() };
  lsSet('bsz-prog', ST.progress);
}

/* toast */
function toast(msg, kind = 'info', ms = 3000) {
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `<span>${kind==='ok'?'✅':kind==='err'?'❌':'ℹ️'}</span><span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.animation = 'tIn .28s reverse both'; setTimeout(() => el.remove(), 300); }, ms);
}

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
function go(page, opts = {}) {
  // Save current state to stack before navigating (max 30 deep)
  const snap = {
    page: ST.page, id: ST.id, mediaType: ST.mediaType,
    season: ST.season, ep: ST.ep, query: ST.query,
    genre: ST.genre, genreName: ST.genreName,
  };
  // Don't push duplicate consecutive entries
  const last = ST._navStack[ST._navStack.length - 1];
  const isDup = last && last.page === snap.page && last.id === snap.id;
  if (!isDup) {
    ST._navStack.push(snap);
    if (ST._navStack.length > 30) ST._navStack.shift();
  }

  // Apply new state
  ST.page = page;
  if (opts.id        !== undefined) ST.id        = +opts.id;
  if (opts.mediaType !== undefined) ST.mediaType = opts.mediaType;
  if (opts.season    !== undefined) ST.season    = +opts.season;
  if (opts.ep        !== undefined) ST.ep        = +opts.ep;
  if (opts.query     !== undefined) ST.query     = opts.query;
  if (opts.genre     !== undefined) ST.genre     = +opts.genre;
  if (opts.genreName !== undefined) ST.genreName = opts.genreName;

  clearHeroTimer();
  closeDrop();
  closeDrawer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.title = pageTitles[page] || 'BEBU Streaming Zone';
  renderNav();
  renderPage();
}
window.go = go;

function goBack() {
  // Pop the last entry off the stack and restore it
  const prev = ST._navStack.pop();
  if (!prev) { go('home'); return; }

  // Restore state without pushing to stack again
  ST.page      = prev.page;
  ST.id        = prev.id;
  ST.mediaType = prev.mediaType;
  ST.season    = prev.season;
  ST.ep        = prev.ep;
  ST.query     = prev.query;
  ST.genre     = prev.genre;
  ST.genreName = prev.genreName;

  clearHeroTimer();
  closeDrop();
  closeDrawer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.title = pageTitles[ST.page] || 'BEBU Streaming Zone';
  renderNav();
  renderPage();
}
window.goBack = goBack;

      `<div class="drawer-link ${ST.page===p.id?'on':''}" onclick="go('${p.id}')">${p.icon} ${p.label}</div>`
    ).join('');

}

let srchTimer;
const srchInp = document.getElementById('srch-inp');
srchInp.addEventListener('input', e => {
  clearTimeout(srchTimer);
  const q = e.target.value.trim();
  if (!q) { closeDrop(); return; }
  srchTimer = setTimeout(async () => {
    if (q.length < 2) return;
    try {
      const d = await A.search(q, 1);
      const items = d.results.filter(i => i.media_type !== 'person' && i.poster_path && (i.title || i.name)).slice(0, 6);
      showDrop(items, q);
    } catch {}
  }, 380);
});
srchInp.addEventListener('keydown', e => {
  if (e.key === 'Enter') { go('search', { query: e.target.value.trim() }); closeDrop(); }
  if (e.key === 'Escape') closeDrop();
});
srchInp.addEventListener('focus', () => { if (srchInp.value.trim().length >= 2) document.getElementById('sdrop').classList.add('show'); });
document.addEventListener('click', e => { if (!e.target.closest('.srch-wrap')) closeDrop(); });

function showDrop(items, q) {
  const drop = document.getElementById('sdrop');
  if (!items.length) { drop.innerHTML = `<div class="sd-row" style="justify-content:center;color:var(--txt3);font-size:.8rem">No results</div>`; drop.classList.add('show'); return; }
  drop.innerHTML = items.map(i => {
    const t = mtype(i); regItem(i);
    return `<div class="sd-row" onclick="go('detail',{id:${i.id},mediaType:'${t}'});closeDrop()">
      <img class="sd-img" src="${img.poster(i.poster_path,'w92')}" onerror="this.src='https://placehold.co/92x138/181826/555?text=?'" loading="lazy"/>
      <div style="flex:1;min-width:0">
        <div class="sd-title">${title(i)}</div>
        <div class="sd-meta">${year(date(i))||''}${i.vote_average?` · ⭐ ${rating(i.vote_average)}`:''}</div>
      </div>
      <span class="sd-type">${t==='tv'?'TV':'Film'}</span>
    </div>`;
  }).join('') + `<div class="sd-row" style="justify-content:center;color:var(--red);font-size:.8rem;font-weight:600;gap:5px" onclick="go('search',{query:'${q.replace(/'/g,"\\'")}'})">${SVG.srch} All results for "${q}"</div>`;
  drop.classList.add('show');
}
function closeDrop() { document.getElementById('sdrop').classList.remove('show'); }
window.closeDrop = closeDrop;

/* ═══════════════════════════════════════════════
   QUALITY HELPER
═══════════════════════════════════════════════ */
function qualityBadge(item) {
  const t = mtype(item);
  if (t === 'tv') return `<span class="card-qual qual-hd">HD</span>`;
  const rel = item.release_date || '';
  if (!rel) return `<span class="card-qual qual-hd">HD</span>`;
  const daysSince = (Date.now() - new Date(rel)) / 86400000;
  if (daysSince < 0)  return `<span class="card-qual qual-new">SOON</span>`;
  if (daysSince < 35) return `<span class="card-qual qual-cam">CAM</span>`;
  if (daysSince < 90) return `<span class="card-qual qual-new">NEW</span>`;
  return `<span class="card-qual qual-hd">HD</span>`;
}

// Returns the label text for inline use on detail page
function qualityLabel(item) {
  const t = mtype(item);
  if (t === 'tv') return { label:'HD', cls:'qual-hd' };
  const rel = item.release_date || '';
  if (!rel) return { label:'HD', cls:'qual-hd' };
  const d = (Date.now() - new Date(rel)) / 86400000;
  if (d < 0)  return { label:'SOON', cls:'qual-new' };
  if (d < 35) return { label:'CAM', cls:'qual-cam' };
  if (d < 90) return { label:'NEW', cls:'qual-new' };
  return { label:'HD', cls:'qual-hd' };
}

function buildCard(item, { type, wide = false } = {}) {
  const t = type || mtype(item);
  regItem({ ...item, media_type: t });
  const fav = isFav(item.id);
  const prg = getProgress(item.id);
  const poster = wide ? (img.back(item.backdrop_path,'w500') || img.poster(item.poster_path)) : img.poster(item.poster_path);
  return `
<div class="card${wide?' card-wide':''}" data-card-id="${item.id}" onclick="go('detail',{id:${item.id},mediaType:'${t}'})" role="button" tabindex="0"
     onkeydown="if(event.key==='Enter'||event.key===' ')go('detail',{id:${item.id},mediaType:'${t}'})">
  <img class="card-img" src="${poster}" alt="${title(item).replace(/"/g,'')}" loading="lazy"
       onerror="this.src='https://placehold.co/342x513/181826/555?text=?'"/>
  <div class="card-ovl"></div>
  <div class="card-play">${SVG.play2}</div>
  <!-- LEFT column: type badge + quality badge stacked -->
  <span class="card-badge">${t==='tv'?'TV':'FILM'}</span>
  <div class="card-qual-wrap">${qualityBadge(item)}</div>
  <!-- RIGHT: bookmark button alone -->
  <button class="card-fav${fav?' saved':''}" data-fid="${item.id}"
    onclick="event.stopPropagation();toggleFav(${item.id})"
    title="${fav?'Remove from Watchlist':'Add to Watchlist'}">${fav?SVG.bmSolid:SVG.bm}</button>
  <div class="card-info">
    <div class="card-name">${title(item)}</div>
    <div class="card-meta">
      <span class="card-rat">${SVG.star} ${rating(item.vote_average)}</span>
      <span class="card-yr">${year(date(item))}</span>
    </div>
  </div>
  ${prg ? `<div class="card-prog"><div class="card-prog-fill" style="width:${Math.min(prg.pct,100)}%"></div></div>` : ''}
</div>`;
}

function removeRecent(id) {

function heroHTML(idx) {
  const items = ST.hero.items;
  const item  = items[idx];
  if (!item) return '';
  const t     = mtype(item);
  const bg    = img.back(item.backdrop_path, 'original');
  const prg   = getProgress(item.id);
  return `
<div class="hero">
  <div class="hero-img" id="hero-bg" style="background-image:url('${bg}')"></div>
  <div class="hero-ovl"></div>

          ${SVG.play} ${prg && prg.pct > 5 ? 'Continue' : 'Watch Now'}
        </button>

        </button>

          ${isFav(item.id) ? SVG.heartSolid : SVG.heart}
        </button>

    ${items.map((_,i)=>`<div class="hdot${i===idx?' on':''}" onclick="setHero(${i})"></div>`).join('')}
  </div>

}

function setHero(idx) {
  const items = ST.hero.items;
  if (!items.length || idx < 0 || idx >= items.length) return;
  ST.hero.idx = idx;
  const item = items[idx];
  const t = mtype(item);
  const bg = img.back(item.backdrop_path, 'original');
  const prg = getProgress(item.id);

  const bgEl = document.getElementById('hero-bg');
  if (bgEl && bg) { bgEl.style.opacity = '0'; setTimeout(() => { bgEl.style.backgroundImage = `url('${bg}')`; bgEl.style.opacity = '1'; }, 420); }

  const dots = document.getElementById('hero-dots');
  if (dots) dots.querySelectorAll('.hdot').forEach((d, i) => d.classList.toggle('on', i === idx));

  const info = document.getElementById('hero-info');
  if (info) {
    info.style.animation = 'none'; void info.offsetWidth; info.style.animation = 'hUp .55s var(--ease) both';
    const tEl = document.getElementById('hero-title'); if (tEl) tEl.textContent = title(item);
    const dEl = document.getElementById('hero-desc');  if (dEl) dEl.textContent = item.overview || '';
    const wBtn = document.getElementById('hero-watch');
    if (wBtn) { wBtn.setAttribute('onclick', `go('watch',{id:${item.id},mediaType:'${t}',season:1,ep:1})`); wBtn.innerHTML = `${SVG.play} ${prg && prg.pct > 5 ? 'Continue' : 'Watch Now'}`; }
    const iBtn = document.getElementById('hero-info-btn');
    if (iBtn) iBtn.setAttribute('onclick', `go('detail',{id:${item.id},mediaType:'${t}'})`);
    info.querySelectorAll('[data-fid]').forEach(b => {
      b.dataset.fid = item.id; b.innerHTML = isFav(item.id) ? SVG.heartSolid : SVG.heart;
      b.setAttribute('onclick', `toggleFav(${item.id})`);
    });
  }
}
window.setHero = setHero;

function startHeroTimer() {
  clearHeroTimer();
  ST.hero.timer = setInterval(() => {
    if (!ST.hero.paused) setHero((ST.hero.idx + 1) % ST.hero.items.length);
  }, 7500);
}

async function filterMovies(cat) {
  ST.movCat = cat; ST.movPage = 1; ST.movItems = [];
  document.querySelectorAll('[data-mc]').forEach(el => el.classList.toggle('on', el.dataset.mc === cat));
  const g = document.getElementById('mov-grid'); if (g) g.innerHTML = skelGrid();
  const btn = document.getElementById('mov-more'); if (btn) btn.style.display = 'none';
  await loadMovies();
}

async function loadMovies() {
  if (ST.movLoading) return; ST.movLoading = true;
  try {
    // On first load, fetch 3 pages at once for ~60 items
    const isFirst = ST.movPage === 1;
    if (isFirst) {
      const pages = await Promise.all([1,2,3].map(p => A.paged('movie', ST.movCat, p)));
      const seen = new Set();
      pages.forEach(d => d.results.forEach(i => { if (!seen.has(i.id)) { seen.add(i.id); ST.movItems.push(regItem({...i, media_type:'movie'})); } }));
      ST.movPage = 4;
      const g = document.getElementById('mov-grid');
      if (g) g.innerHTML = ST.movItems.map(i => buildCard(i, { type:'movie' })).join('');
      const btn = document.getElementById('mov-more');
      const lastPage = pages[pages.length-1];
      if (btn) btn.style.display = ST.movPage <= lastPage.total_pages ? 'inline-flex' : 'none';
    } else {
      const d = await A.paged('movie', ST.movCat, ST.movPage);
      d.results.forEach(i => ST.movItems.push(regItem({...i, media_type:'movie'})));
      const g = document.getElementById('mov-grid');
      if (g) g.innerHTML = ST.movItems.map(i => buildCard(i, { type:'movie' })).join('');
      const btn = document.getElementById('mov-more');
      if (btn) btn.style.display = ST.movPage < d.total_pages ? 'inline-flex' : 'none';
      ST.movPage++;
    }
  } catch (e) { console.warn(e); }
  ST.movLoading = false;
}

window.filterMovies = filterMovies;
window.loadMoreMovies = loadMovies;

async function pageTrending() {
  let curWindow = 'week';
  const main = document.getElementById('main');
  main.innerHTML = `
<div class="fade-in">
  <div class="pg-hd"><div class="pg-title">🔥 Trending</div><div class="pg-sub">What everyone is watching right now</div></div>
  <div class="filters">

  <div class="section" style="padding-top:0"><div class="grid" id="tr-grid">${skelGrid()}</div></div>
  ${ftHTML()}
</div>`;

  async function loadTr(w) {
    const g = document.getElementById('tr-grid'); if (!g) return;
    g.innerHTML = skelGrid(18);
    try {
      const [d1, d2, d3] = await Promise.all([A.trending('all', w), A.trending('movie', w), A.trending('tv', w)]);
      const seen = new Set(); const combined = [];
      [...d1.results, ...d2.results, ...d3.results].forEach(i => { if (!seen.has(i.id)) { seen.add(i.id); combined.push(i); } });
      g.innerHTML = combined.slice(0, 60).map(i => buildCard(i)).join('');
    } catch { if (g) g.innerHTML = errorState('Failed to load trending.'); }
  }

  window.setTW = async w => {
    curWindow = w;
    document.querySelectorAll('[data-tw]').forEach(el => el.classList.toggle('on', el.dataset.tw === w));
    await loadTr(w);

  await loadTr(curWindow);

async function pageGenreResults() {
  let curType = 'movie', pg = 1, items = [], loading = false;
  const { genre, genreName } = ST;
  const main = document.getElementById('main');

  main.innerHTML = `
<div class="fade-in">
  <div class="pg-hd">
    <button class="btn btn-out btn-sm" onclick="goBack()" style="margin-bottom:14px">${SVG.chL} Back</button>
    <div class="pg-title">${GICONS[genre]||'🎬'} ${genreName}</div>
    <div class="pg-sub">Browse ${genreName} movies and shows</div>
  </div>
  <div class="filters">
    <div class="fpill on" data-gt="movie" onclick="setGT('movie')">🎬 Movies</div>
    <div class="fpill" data-gt="tv" onclick="setGT('tv')">📺 TV Shows</div>
  </div>
  <div class="section" style="padding-top:0">
    <div class="grid" id="g-grid">${skelGrid()}</div>
    <div style="text-align:center;padding:28px 0">
      <button class="btn btn-dim" id="g-more" onclick="loadGenre()" style="display:none">Load More</button>
    </div>
  </div>
  ${ftHTML()}
</div>`;

  async function loadGenre() {
    if (loading) return; loading = true;
    try {
      const isFirst = pg === 1;
      if (isFirst) {
        const pages = await Promise.all([1,2,3].map(p => A.byGenre(curType, genre, p)));
        const seen = new Set();
        pages.forEach(d => d.results.forEach(i => { if (!seen.has(i.id)) { seen.add(i.id); items.push(regItem({...i, media_type: curType})); } }));
        pg = 4;
        const g = document.getElementById('g-grid'); if (g) g.innerHTML = items.map(i => buildCard(i, { type: curType })).join('');
        const btn = document.getElementById('g-more');
        const lastPage = pages[pages.length - 1];
        if (btn) btn.style.display = pg <= lastPage.total_pages ? 'inline-flex' : 'none';
      } else {
        const d = await A.byGenre(curType, genre, pg);
        d.results.forEach(i => items.push(regItem({...i, media_type: curType})));
        const g = document.getElementById('g-grid'); if (g) g.innerHTML = items.map(i => buildCard(i, { type: curType })).join('');
        const btn = document.getElementById('g-more'); if (btn) btn.style.display = pg < d.total_pages ? 'inline-flex' : 'none';
        pg++;
      }
    } catch { console.warn('genre load error'); }
    loading = false;
  }

  window.setGT = async t => {
    curType = t; pg = 1; items = [];
    document.querySelectorAll('[data-gt]').forEach(el => el.classList.toggle('on', el.dataset.gt === t));
    const g = document.getElementById('g-grid'); if (g) g.innerHTML = skelGrid();
    await loadGenre();
  };
  window.loadGenre = () => loadGenre();

  await loadGenre();
}

function setupProgressTracker(id, type) {
  const handler = evt => {
    if (typeof evt.data !== 'string') return;
    try {
      const d = JSON.parse(evt.data);
      if (d?.type === 'PLAYER_EVENT' && d.data?.progress > 2) {
        saveProgress(id, type, d.data.progress, d.data.season || ST.season, d.data.episode || ST.ep);
      }
    } catch {}
  };
  if (window._tracker) window.removeEventListener('message', window._tracker);
  window._tracker = handler;
  window.addEventListener('message', handler);
}

/* ═══════════════════════════════════════════════
   TV D-PAD KEYBOARD NAVIGATION
═══════════════════════════════════════════════ */
(function setupDPad() {
  const FOCUSABLE = 'button,.card,.t10-wrap,.rec-wrap,.drawer-link,.fpill,.stab,.back-btn,.nav-links a,.ep-card,.genre-chip,.hdot,.sec-all,.logo,input,a[tabindex],div[tabindex="0"]';

  document.addEventListener('keydown', e => {
    const key = e.key;

    // Let inputs handle their own keys
    if (document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;

    // Navigation shortcuts
    if (key === 'Escape') {
      closeTrailer(); closeDrawer();
      // On detail/watch page, Escape also goes back
      if ((ST.page === 'detail' || ST.page === 'watch') && !document.getElementById('tmodal').classList.contains('open')) {
        goBack();
      }
      return;
    }
    if (key === '/') { e.preventDefault(); document.getElementById('srch-inp')?.focus(); return; }

    // D-PAD arrow navigation
    if (!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(key)) return;
    e.preventDefault();

    const all = Array.from(document.querySelectorAll(FOCUSABLE)).filter(el => {
      const r = el.getBoundingClientRect();
      return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== 'hidden';
    });

    const cur = document.activeElement;
    const curIdx = all.indexOf(cur);

    if (key === 'Enter' || key === ' ') {
      if (cur && cur !== document.body) { cur.click(); return; }
    }

    if (curIdx === -1 || !cur || cur === document.body) {
      // Nothing focused — focus first card or nav item
      const first = all.find(el => el.classList.contains('card') || el.tagName === 'A');
      if (first) first.focus();
      return;
    }

    const curRect = cur.getBoundingClientRect();
    const cx = curRect.left + curRect.width / 2;
    const cy = curRect.top + curRect.height / 2;

    let best = null, bestDist = Infinity;

    for (const el of all) {
      if (el === cur) continue;
      const r = el.getBoundingClientRect();
      const ex = r.left + r.width / 2;
      const ey = r.top + r.height / 2;
      const dx = ex - cx, dy = ey - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      const isRight = dx > 20  && Math.abs(dy) < Math.abs(dx) * 1.5;
      const isLeft  = dx < -20 && Math.abs(dy) < Math.abs(dx) * 1.5;
      const isDown  = dy > 20  && Math.abs(dx) < Math.abs(dy) * 1.5;
      const isUp    = dy < -20 && Math.abs(dx) < Math.abs(dy) * 1.5;

      const match = (key === 'ArrowRight' && isRight) ||
                    (key === 'ArrowLeft'  && isLeft)  ||
                    (key === 'ArrowDown'  && isDown)  ||
                    (key === 'ArrowUp'    && isUp);

      if (match && dist < bestDist) { bestDist = dist; best = el; }
    }

    if (best) {
      best.focus();
      // Scroll into view smoothly
      best.scrollIntoView({ block:'nearest', inline:'nearest', behavior:'smooth' });
    } else if (key === 'ArrowDown') {
      // If no element below, scroll page down
      window.scrollBy({ top: window.innerHeight * 0.6, behavior: 'smooth' });
    } else if (key === 'ArrowUp') {
      window.scrollBy({ top: -window.innerHeight * 0.6, behavior: 'smooth' });
    }
  });
})();

/* ═══════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════ */
renderNav();
renderPage();
</script>
