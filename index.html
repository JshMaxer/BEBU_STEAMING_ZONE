<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEBU STREAMING ZONE</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23e8133a'/><stop offset='100%25' stop-color='%23ff9f43'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text x='50' y='68' font-family='Arial Black,sans-serif' font-size='54' font-weight='900' text-anchor='middle' fill='white'>B</text></svg>" />
  <meta name="theme-color" content="#e8133a" />
  <meta name="description" content="A cinema-grade streaming portal for movies and TV shows, powered by TMDB metadata and CineSrc playback." />

  <!-- Google Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toasts" aria-live="polite"></div>

  <!-- Scroll To Top Floating Button -->
  <div id="s2t" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="Scroll to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
  </div>

  <!-- YouTube Trailer Modal -->
  <div id="trailer-modal" class="modal-overlay" onclick="if(event.target === this) window.closeTrailerModal()">
    <div class="tm-inner">
      <button class="tm-cls" onclick="window.closeTrailerModal()" title="Close Trailer">✕</button>
      <iframe id="trailer-iframe" src="" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>
  </div>

  <!-- Cinema Player Modal (Optimized 60 FPS / Direct Decoding) -->
  <div id="player-modal" class="cinema-modal-overlay" onclick="if(event.target === this) window.closePlayerModal()">
    <div class="cinema-modal-container">
      <div class="cinema-bar">
        <div class="cinema-bar-left">
          <div class="cinema-title-group">
            <div class="cinema-title" id="player-modal-title">Loading Title…</div>
            <div class="cinema-subtitle" id="player-modal-sub">CineSrc Ultra HD</div>
          </div>
        </div>
        <div class="cinema-bar-right">
          <div class="cinesrc-badge">
            <span class="cinesrc-dot"></span>
            <span class="cinesrc-text">CineSrc Ultra HD</span>
          </div>
          <button id="player-ep-toggle" class="cinema-btn cinema-ep-btn" onclick="window.togglePlayerEpisodeDrawer()" title="Select Episodes" style="display:none">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span>Episodes</span>
          </button>
          <button id="player-modal-watchlist-btn" class="cinema-btn cinema-ico-btn" onclick="window.handlePlayerWatchlistToggle()" title="Watchlist">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="cinema-btn cinema-cls-btn cinema-ico-btn" onclick="window.closePlayerModal()" title="Close Player (Esc)" aria-label="Close Player">✕</button>
        </div>
      </div>
      <div class="cinema-body-layout">
        <div class="cinema-player-frame" id="cinema-player-frame">
          <div class="cinema-iframe-wrap">
            <iframe id="cinema-iframe" src="" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
          </div>
        </div>
        <div class="cinema-ep-drawer" id="cinema-ep-drawer">
          <div class="cinema-ep-header">
            <div class="cinema-ep-title">Season &amp; Episodes</div>
            <button class="cinema-ep-close-btn" onclick="window.togglePlayerEpisodeDrawer()" title="Close Episodes">✕</button>
          </div>
          <div class="cinema-season-nav" id="cinema-season-nav"></div>
          <div class="cinema-range-nav" id="cinema-range-nav" style="display:none"></div>
          <div class="cinema-ep-list" id="cinema-ep-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Data Backup / Restore Modal -->
  <div id="data-modal" class="modal-overlay" onclick="if(event.target === this) window.closeDataModal()"></div>

  <!-- Smart Next Episode Overlay Container -->
  <div id="next-ep-modal"></div>

  <!-- Mobile Drawer -->
  <div id="drawer" onclick="if(event.target === this || event.target.id === 'drawer-bg') window.closeDrawer()">
    <div id="drawer-bg"></div>
    <div id="drawer-panel">
      <div class="drawer-logo">
        <span class="logo-text">BEBU_ZONE</span>
        <button class="drawer-cls" onclick="window.closeDrawer()" aria-label="Close menu">✕</button>
      </div>
      <div class="drawer-srch-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="drawer-srch" type="text" placeholder="Search movies & shows…" autocomplete="off" 
               onkeydown="if(event.key==='Enter'){ window.navigateTo('/search?q=' + encodeURIComponent(this.value.trim())); window.closeDrawer(); }" />
        <div id="drawer-sdrop"></div>
      </div>
      <div id="drawer-links"></div>
    </div>
  </div>

  <!-- Sticky Blur Navigation Bar -->
  <nav id="nb"></nav>

  <!-- Main View Container -->
  <main id="main">
    <div class="spin-wrap"><div class="spinner"></div></div>
  </main>

  <!-- Application Entry Point (ES Module) -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
