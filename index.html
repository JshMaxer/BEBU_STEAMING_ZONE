<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BEBU STREAMING ZONE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23e8133a'/><stop offset='100%25' stop-color='%23ff9f43'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text x='50' y='68' font-family='Arial Black,sans-serif' font-size='54' font-weight='900' text-anchor='middle' fill='white'>B</text></svg>"/>
<meta name="theme-color" content="#e8133a"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#08080e;--bg2:#0f0f1a;--bg3:#181826;--bg4:#22223a;
  --red:#e8133a;--orange:#ff5e3a;--gold:#fbbf24;
  --grad:linear-gradient(135deg,#e8133a,#ff5e3a 55%,#ff9f43);
  --txt:#f0f0ff;--txt2:rgba(240,240,255,.6);--txt3:rgba(240,240,255,.3);
  --brd:rgba(255,255,255,.07);
  --nav:64px;--r:6px;--rm:12px;--rl:20px;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:rgba(232,19,58,.5);border-radius:3px}::-webkit-scrollbar-track{background:transparent}

/* ── NAV ── */
#nb{position:fixed;top:0;left:0;right:0;height:var(--nav);z-index:200;display:flex;align-items:center;padding:0 4%;gap:6px;transition:background .3s,border-color .3s}
#nb.solid{background:rgba(8,8,14,.96);backdrop-filter:blur(24px);border-bottom:1px solid var(--brd)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;cursor:pointer;flex-shrink:0;margin-right:8px;transition:filter .2s}
.logo:hover{filter:brightness(1.15)}
.nav-links{display:flex;gap:0;list-style:none;align-items:center}
.nav-links a{color:var(--txt2);text-decoration:none;font-size:.84rem;font-weight:500;padding:7px 13px;border-radius:var(--r);transition:color .2s,background .2s;cursor:pointer;white-space:nowrap;position:relative}
.nav-links a::after{content:'';position:absolute;bottom:2px;left:13px;right:13px;height:2px;background:var(--grad);border-radius:1px;transform:scaleX(0);transition:transform .25s var(--ease)}
.nav-links a:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.nav-links a.on{color:var(--txt)}.nav-links a.on::after{transform:scaleX(1)}
.srch-wrap{position:relative;margin-left:auto;margin-right:6px}
.srch-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--txt3);pointer-events:none;z-index:2}
#srch-inp{background:rgba(255,255,255,.07);border:1px solid var(--brd);border-radius:50px;padding:8px 14px 8px 35px;color:var(--txt);font-family:'Outfit',sans-serif;font-size:.83rem;width:195px;outline:none;transition:all .3s}
#srch-inp::placeholder{color:var(--txt3)}
#srch-inp:focus{width:250px;border-color:var(--red);background:rgba(232,19,58,.07);box-shadow:0 0 0 3px rgba(232,19,58,.1)}
#sdrop{position:absolute;top:calc(100% + 8px);right:0;width:300px;background:var(--bg2);border:1px solid var(--brd);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.8);display:none;z-index:300;overflow:hidden}
#sdrop.show{display:block;animation:dropIn .2s var(--ease)}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.sd-row{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--brd)}
.sd-row:last-child{border:none}.sd-row:hover{background:rgba(232,19,58,.07)}
.sd-img{width:38px;height:55px;border-radius:5px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.sd-title{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-meta{font-size:.69rem;color:var(--txt2);margin-top:2px}
.sd-type{font-size:.6rem;padding:2px 6px;border-radius:3px;background:rgba(232,19,58,.15);color:var(--red);font-weight:700;flex-shrink:0}
.nav-hbg{display:none;background:none;border:none;color:var(--txt2);cursor:pointer;padding:8px;border-radius:var(--r);transition:color .2s}
.nav-hbg:hover{color:var(--txt)}

/* ── DRAWER ── */
#drawer{position:fixed;inset:0;z-index:190;display:none}
#drawer.open{display:block}
#drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px)}
#drawer-panel{position:absolute;left:0;top:0;bottom:0;width:280px;background:var(--bg2);border-right:1px solid var(--brd);padding:0 0 28px;overflow-y:auto;transform:translateX(-100%);transition:transform .3s var(--ease)}
#drawer.open #drawer-panel{transform:translateX(0)}
.drawer-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;padding:18px 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--brd);margin-bottom:6px}
.drawer-cls{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:1.1rem;-webkit-text-fill-color:var(--txt3)}
.drawer-srch-wrap{padding:12px 16px 8px;border-bottom:1px solid var(--brd);position:relative}
.drawer-srch-wrap svg{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--txt3);pointer-events:none}
#drawer-srch{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--brd);border-radius:50px;padding:9px 14px 9px 36px;color:var(--txt);font-family:'Outfit',sans-serif;font-size:.85rem;outline:none}
#drawer-srch:focus{border-color:var(--red)}
#drawer-sdrop{background:var(--bg3);border-radius:10px;margin:8px 0 0;overflow:hidden;display:none}
#drawer-sdrop.show{display:block}
.dsd-row{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--brd);transition:background .15s}
.dsd-row:last-child{border:none}.dsd-row:hover,.dsd-row:active{background:rgba(232,19,58,.08)}
.dsd-img{width:34px;height:50px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--bg2)}
.dsd-title{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsd-meta{font-size:.68rem;color:var(--txt2)}
.drawer-link{display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--txt2);cursor:pointer;transition:all .18s;font-size:.9rem;font-weight:500}
.drawer-link:hover{color:var(--txt);background:rgba(255,255,255,.04)}.drawer-link.on{color:var(--red);background:rgba(232,19,58,.08)}

/* ── SCROLL TOP ── */
#s2t{position:fixed;bottom:24px;right:20px;z-index:150;width:42px;height:42px;border-radius:50%;background:var(--bg3);border:1px solid rgba(232,19,58,.3);color:var(--red);display:none;align-items:center;justify-content:center;cursor:pointer;transition:all .25s var(--spring);box-shadow:0 6px 20px rgba(0,0,0,.5)}
#s2t.show{display:flex}#s2t:hover{background:var(--red);color:#fff;transform:translateY(-3px) scale(1.08)}

/* ── TRAILER MODAL ── */
#tmodal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center}
#tmodal.open{display:flex}
.tm-inner{position:relative;width:92%;max-width:940px;aspect-ratio:16/9;border-radius:var(--rl);overflow:hidden;background:#000;box-shadow:0 40px 80px rgba(0,0,0,.9)}
.tm-inner iframe{width:100%;height:100%;border:none}
.tm-cls{position:absolute;top:-46px;right:0;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}.tm-cls:hover{background:var(--red)}

/* ── TOAST ── */
#toasts{position:fixed;bottom:22px;right:20px;z-index:500;display:flex;flex-direction:column;gap:7px}
.toast{display:flex;align-items:center;gap:8px;padding:10px 15px;background:var(--bg3);border:1px solid var(--brd);border-radius:10px;font-size:.82rem;box-shadow:0 6px 24px rgba(0,0,0,.65);animation:tin .28s var(--ease);max-width:280px}
.toast.ok{border-color:#22c55e}.toast.err{border-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:none}}

/* ── MAIN ── */
#main{padding-top:var(--nav);min-height:100vh}
.spin-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh}
.spinner{width:44px;height:44px;border:3px solid rgba(232,19,58,.15);border-top-color:var(--red);border-radius:50%;animation:sp .72s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── HERO ── */
.hero{position:relative;height:88vh;min-height:480px;max-height:880px;overflow:hidden;background:#000}
.hero-bg{position:absolute;inset:-2%;background-size:cover;background-position:center 18%;transform:scale(1.04);transition:opacity .9s ease}
.hero-ovl{position:absolute;inset:0;background:linear-gradient(to right,rgba(8,8,14,.98) 0%,rgba(8,8,14,.74) 36%,rgba(8,8,14,.3) 65%,rgba(8,8,14,.6) 100%),linear-gradient(to top,rgba(8,8,14,1) 0%,transparent 48%)}
.hero-edge{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad)}
.hero-body{position:relative;z-index:2;height:100%;display:flex;align-items:flex-end;padding:0 6% 92px;max-width:700px}
.hero-info{animation:hUp .65s var(--ease) both}
@keyframes hUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero-tag{display:inline-flex;align-items:center;gap:5px;background:var(--grad);color:#fff;font-size:.61rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:3px 10px;border-radius:4px;margin-bottom:13px}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.6rem,6.5vw,5rem);line-height:.93;letter-spacing:.02em;text-shadow:0 2px 30px rgba(0,0,0,.9);margin-bottom:12px}
.hero-stats{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:.82rem;color:var(--txt2)}
.hero-stats .gold{color:var(--gold);font-weight:700;display:flex;align-items:center;gap:4px}
.hero-desc{font-size:.86rem;color:var(--txt2);line-height:1.68;max-width:490px;margin-bottom:24px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-btns{display:flex;gap:11px;flex-wrap:wrap}
.hero-ctrl{position:absolute;bottom:52px;right:6%;z-index:3;display:flex;align-items:center;gap:8px}
.hcb{background:rgba(8,8,14,.7);border:1px solid rgba(255,255,255,.15);color:var(--txt2);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .22s;backdrop-filter:blur(8px)}
.hcb:hover{color:var(--txt);border-color:rgba(255,255,255,.4);background:rgba(232,19,58,.3)}
.hero-prog{position:absolute;bottom:0;left:0;right:0;display:flex;z-index:3;height:3px}
.hps{flex:1;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
.hps.done{background:rgba(232,19,58,.55)}.hps.cur .hpf{position:absolute;inset:0;background:var(--grad);animation:hpFill 7.5s linear both}
@keyframes hpFill{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:10px;font-family:'Outfit',sans-serif;font-size:.86rem;font-weight:600;cursor:pointer;border:none;text-decoration:none;white-space:nowrap;transition:all .24s var(--ease)}
.btn-red{background:var(--grad);color:#fff;box-shadow:0 4px 18px rgba(232,19,58,.35)}.btn-red:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(232,19,58,.5)}
.btn-dim{background:rgba(255,255,255,.1);color:var(--txt);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.13)}.btn-dim:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.btn-out{background:transparent;color:var(--txt2);border:1px solid rgba(255,255,255,.14)}.btn-out:hover{color:var(--txt);border-color:var(--red);background:rgba(232,19,58,.08)}
.btn-ico{padding:9px;border-radius:50%;aspect-ratio:1}.btn-sm{padding:7px 15px;font-size:.79rem}

/* ── SECTIONS ── */
.section{padding:28px 5%}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-title{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-title::before{content:'';width:4px;height:20px;background:var(--grad);border-radius:2px;display:block;flex-shrink:0}
.sec-more{font-size:.79rem;color:var(--red);cursor:pointer;display:flex;align-items:center;gap:3px;font-weight:600;transition:opacity .18s}.sec-more:hover{opacity:.7}

/* ── ROW ── */
.row-wrap{position:relative}
.card-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.card-row::-webkit-scrollbar{display:none}
.rarr{position:absolute;top:50%;transform:translateY(-50%);z-index:10;background:rgba(8,8,14,.88);border:1px solid var(--brd);color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px);transition:all .22s}
.rarr:hover{background:var(--red);border-color:var(--red);transform:translateY(-50%) scale(1.1)}
.rarrl{left:-18px}.rarrr{right:-18px}

/* ── CARD ── */
.card{flex-shrink:0;width:155px;scroll-snap-align:start;cursor:pointer;position:relative;border-radius:10px;overflow:hidden;transition:transform .3s var(--spring),box-shadow .3s;background:var(--bg3);will-change:transform;isolation:isolate}
.card:hover{transform:scale(1.08) translateY(-7px);z-index:5;box-shadow:0 20px 50px rgba(0,0,0,.85)}
.card:hover .card-play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card:hover .card-ovl{opacity:1}.card:hover .card-info{transform:none;opacity:1}.card:hover .card-fav{opacity:1}
.card-img{width:100%;height:233px;object-fit:cover;display:block;background:var(--bg3)}
.card-ovl{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,14,.98) 0%,rgba(8,8,14,.45) 55%,transparent 100%);opacity:.6;transition:opacity .28s}
.card-play{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) scale(.65);width:46px;height:46px;border-radius:50%;background:rgba(232,19,58,.9);display:flex;align-items:center;justify-content:center;opacity:0;transition:all .28s var(--spring);box-shadow:0 0 0 8px rgba(232,19,58,.15)}
.card-info{position:absolute;bottom:0;left:0;right:0;padding:9px 8px;transform:translateY(4px);opacity:.88;transition:all .25s}
.card-name{font-size:.73rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.card-meta{display:flex;justify-content:space-between;align-items:center}
.card-rat{display:flex;align-items:center;gap:3px;font-size:.67rem;color:var(--gold);font-weight:700}.card-yr{font-size:.65rem;color:var(--txt3)}
/* LEFT: type badge + quality stacked */
.card-badge{position:absolute;top:6px;left:6px;background:var(--grad);color:#fff;font-size:.52rem;font-weight:800;text-transform:uppercase;padding:2px 6px;border-radius:3px;letter-spacing:.07em;pointer-events:none;z-index:3}
.card-qual-wrap{position:absolute;top:26px;left:6px;display:flex;flex-direction:column;gap:3px;pointer-events:none;z-index:3}
.card-qual{display:inline-block;font-size:.5rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:3px;border:1px solid}
.qual-hd{background:rgba(34,197,94,.18);color:#4ade80;border-color:rgba(34,197,94,.35)}
.qual-cam{background:rgba(251,191,36,.2);color:#fbbf24;border-color:rgba(251,191,36,.4)}
.qual-new{background:rgba(99,102,241,.18);color:#818cf8;border-color:rgba(99,102,241,.35)}
/* RIGHT: fav button alone */
.card-fav{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.62);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;opacity:0;transition:opacity .22s,background .22s;backdrop-filter:blur(4px);z-index:3}
.card-fav.saved{color:var(--red);opacity:1!important}.card-fav:hover{background:rgba(232,19,58,.6)}
.card-prog{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08)}.card-prog-fill{height:100%;background:var(--grad)}
.card-wide{width:230px}.card-wide .card-img{height:132px}
/* recently viewed / CW wrapper */
.rec-wrap{position:relative;flex-shrink:0;scroll-snap-align:start;display:inline-block}
.rec-remove{position:absolute;top:6px;right:36px;z-index:4;width:24px;height:24px;border-radius:50%;background:rgba(8,8,14,.78);border:1.5px solid rgba(255,255,255,.22);color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.65rem;font-weight:900;line-height:1;opacity:0;transition:opacity .2s,background .2s,border-color .2s;backdrop-filter:blur(4px);pointer-events:auto}
.card:hover .rec-remove{opacity:1}.rec-remove:hover{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
/* CW progress label */
.cwlbl{position:absolute;bottom:52px;left:0;right:0;display:flex;justify-content:center}
.cwpct{font-size:.62rem;font-weight:700;color:var(--red);background:rgba(8,8,14,.85);padding:2px 8px;border-radius:3px;border:1px solid rgba(232,19,58,.25)}

/* ── GRID ── */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.cgrid .card{width:auto}.cgrid .card-img{height:218px}

/* ── SKELETON ── */
.sk{background:linear-gradient(90deg,var(--bg3),rgba(55,55,80,.8),var(--bg3));background-size:200%;animation:sh 1.5s infinite;border-radius:10px}
@keyframes sh{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk-c{flex-shrink:0;width:155px;height:233px}.sk-cw{flex-shrink:0;width:230px;height:132px}.sk-g{height:218px}

/* ── TOP-10 ── */
.t10-wrap{flex-shrink:0;width:185px;scroll-snap-align:start;cursor:pointer;display:flex;align-items:flex-end}
.t10-num{font-family:'Bebas Neue',sans-serif;font-size:5.5rem;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(240,240,255,.16);user-select:none;flex-shrink:0;width:58px;text-align:right}
.t10-card{width:120px;flex-shrink:0;border-radius:10px;overflow:hidden;position:relative;background:var(--bg3);transition:transform .3s var(--spring),box-shadow .3s}
.t10-wrap:hover .t10-card{transform:scale(1.07) translateY(-5px);box-shadow:0 18px 45px rgba(0,0,0,.8)}
.t10-img{width:100%;height:180px;object-fit:cover;display:block;background:var(--bg3)}
.t10-ovl{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,14,.95) 0%,transparent 65%);opacity:.7}
.t10-info{position:absolute;bottom:0;left:0;right:0;padding:7px}
.t10-name{font-size:.7rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t10-rat{font-size:.64rem;color:var(--gold);display:flex;align-items:center;gap:2px;margin-top:2px}

/* ── PAGE HDR ── */
.pg-hd{padding:52px 6% 20px}.pg-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,4vw,3rem);letter-spacing:.025em;margin-bottom:5px}.pg-sub{font-size:.85rem;color:var(--txt2)}
.fb{display:flex;gap:8px;flex-wrap:wrap;padding:0 6% 22px}
.fbb{padding:6px 16px;border-radius:50px;font-size:.79rem;font-weight:600;cursor:pointer;background:var(--bg3);border:1px solid var(--brd);color:var(--txt2);transition:all .2s}
.fbb:hover,.fbb.on{background:rgba(232,19,58,.13);border-color:rgba(232,19,58,.4);color:var(--red)}

/* ── DETAIL ── */
.det-hero{position:relative;height:58vh;min-height:320px;max-height:640px;overflow:hidden}
.det-hero img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.det-hero-ovl{position:absolute;inset:0;background:linear-gradient(to right,rgba(8,8,14,.99),rgba(8,8,14,.65) 45%,rgba(8,8,14,.3)),linear-gradient(to top,rgba(8,8,14,1) 0%,transparent 52%)}
.det-back{position:absolute;top:calc(var(--nav) + 10px);left:6%;z-index:10;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:.8rem;font-weight:600;background:rgba(8,8,14,.7);border:1px solid rgba(255,255,255,.18);color:var(--txt);cursor:pointer;transition:all .2s;backdrop-filter:blur(8px)}
.det-back:hover{background:var(--red);border-color:var(--red);color:#fff}
.det-body{position:relative;padding:0 6%;max-width:1440px;margin:0 auto}
.det-grid{position:relative;margin-top:-170px;display:flex;flex-direction:row;flex-wrap:wrap;gap:36px;align-items:flex-start}
.det-grid>div:first-child{flex-shrink:0}
.det-grid>div:last-child{flex:1;min-width:0}
.det-poster{width:185px;border-radius:var(--rl);box-shadow:0 24px 64px rgba(0,0,0,.9);aspect-ratio:2/3;object-fit:cover;border:1px solid rgba(255,255,255,.08)}
.det-genres{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.gpill{padding:3px 10px;border-radius:50px;font-size:.7rem;color:var(--red);font-weight:700;border:1px solid rgba(232,19,58,.28);background:rgba(232,19,58,.1)}
.det-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,4.5vw,3.8rem);line-height:.94;letter-spacing:.025em;margin-bottom:9px}
.det-tagline{font-size:.83rem;color:var(--txt2);font-style:italic;margin-bottom:12px}
.det-meta{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:16px;font-size:.82rem}
.dmi{display:flex;align-items:center;gap:7px}
.dml{font-size:.63rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:2px}.dmv{font-weight:500}
.rat-ring{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:700;color:var(--gold);flex-shrink:0;box-shadow:0 0 0 4px rgba(251,191,36,.1)}
.det-overview{font-size:.86rem;color:var(--txt2);line-height:1.72;max-width:720px;margin-bottom:24px}
.det-crew{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:24px}
.crew-l{font-size:.63rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em}.crew-v{font-size:.82rem;font-weight:600;margin-top:2px}
.det-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.cast-row{display:flex;gap:13px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cast-row::-webkit-scrollbar{display:none}
.cast-card{flex-shrink:0;width:82px;text-align:center;cursor:pointer}
.cast-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--bg3);margin:0 auto 5px;border:2px solid var(--brd);transition:border-color .2s,transform .2s}
.cast-card:hover .cast-photo{border-color:var(--red);transform:scale(1.07)}
.cast-name{font-size:.69rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cast-char{font-size:.62rem;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── EPISODE SELECTOR ── */
.ep-sel{padding:24px 5%}
.s-tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:16px}
.s-tabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:6px 17px;border-radius:50px;font-size:.79rem;font-weight:600;cursor:pointer;background:var(--bg3);border:1px solid var(--brd);color:var(--txt2);transition:all .2s}
.stab.on,.stab:hover{background:var(--red);border-color:var(--red);color:#fff}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ep-card{display:flex;gap:11px;align-items:center;background:var(--bg3);border:1px solid var(--brd);border-radius:10px;padding:11px;cursor:pointer;transition:all .2s}
.ep-card:hover,.ep-card.playing{border-color:var(--red);background:rgba(232,19,58,.07)}
.ep-thumb{width:92px;height:54px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg2)}
.ep-num{font-size:.63rem;color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.05em}.ep-name{font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-desc{font-size:.68rem;color:var(--txt3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── COLLECTION ── */
.col-sec{padding:28px 5%}
.col-hd{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.col-poster{width:60px;height:90px;border-radius:8px;object-fit:cover;flex-shrink:0;box-shadow:0 6px 20px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08)}
.col-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.3rem,3.5vw,2rem);letter-spacing:.03em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:3px}
.col-count{font-size:.72rem;color:var(--txt3);margin-top:4px}
.col-wrap{flex-shrink:0;width:185px;scroll-snap-align:start;cursor:pointer;display:flex;align-items:flex-end}
.col-card{width:120px;flex-shrink:0;border-radius:10px;overflow:hidden;position:relative;background:var(--bg3);transition:transform .3s var(--spring),box-shadow .3s;border:2px solid transparent}
.col-card.current{border-color:var(--red);box-shadow:0 0 0 3px rgba(232,19,58,.25)}
.col-wrap:hover .col-card{transform:scale(1.07) translateY(-5px);box-shadow:0 18px 44px rgba(0,0,0,.8)}
.col-img{width:100%;height:180px;object-fit:cover;display:block;background:var(--bg3)}
.col-ovl{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,14,.96) 0%,transparent 65%);opacity:.7}
.col-info{position:absolute;bottom:0;left:0;right:0;padding:7px}
.col-title{font-size:.7rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.col-year{font-size:.64rem;color:var(--txt3)}
.col-now{position:absolute;top:7px;left:7px;z-index:3;background:var(--red);color:#fff;font-size:.52rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:3px 7px;border-radius:4px}
.col-num{position:absolute;top:7px;right:7px;z-index:3;background:rgba(8,8,14,.75);color:var(--txt2);font-size:.58rem;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid rgba(255,255,255,.15)}
.col-soon{position:absolute;inset:0;border-radius:10px;background:rgba(8,8,14,.55);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--txt2);text-transform:uppercase}

/* ── WATCH ── */
.watch-bar{display:flex;align-items:center;gap:14px;padding:13px 5%;border-bottom:1px solid var(--brd)}
.watch-title{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;letter-spacing:.03em}.watch-sub{font-size:.76rem;color:var(--txt2)}
.player-outer{background:#000;position:relative;padding-bottom:56.25%;height:0}
.player-outer iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.watch-info{padding:24px 5%;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}

/* ── GENRE ── */
.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px;padding:0 6% 28px}
.genre-chip{background:var(--bg3);border:1px solid var(--brd);border-radius:12px;padding:20px 15px;cursor:pointer;transition:all .24s;position:relative;overflow:hidden}
.genre-chip::before{content:'';position:absolute;inset:0;background:var(--grad);opacity:0;transition:opacity .28s}
.genre-chip:hover{border-color:rgba(232,19,58,.38);transform:translateY(-3px)}.genre-chip:hover::before{opacity:.1}
.genre-chip:hover .genre-name{color:var(--red)}
.genre-ico{font-size:1.75rem;margin-bottom:6px;display:block;position:relative;z-index:1}
.genre-name{font-size:.86rem;font-weight:700;position:relative;z-index:1}.genre-type{font-size:.7rem;color:var(--txt3);position:relative;z-index:1}

/* ═══════════════════════════════════════════════
   CALENDAR
═══════════════════════════════════════════════ */
.cal-wrap{max-width:1400px;margin:0 auto;padding:0 5% 40px}
.cal-top-hd{padding:44px 5% 0}

/* Header bar */
.cal-hd{display:flex;align-items:center;gap:12px;padding:20px 0;flex-wrap:wrap}
.cal-month{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.8rem,4vw,3rem);letter-spacing:.04em;flex:1;min-width:160px}
.cal-month span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cal-nb{background:var(--bg3);border:1px solid var(--brd);color:var(--txt2);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:.85rem;transition:all .2s;display:flex;align-items:center;justify-content:center}
.cal-nb:hover{background:var(--red);border-color:var(--red);color:#fff}
.cal-today-btn{padding:7px 16px;border-radius:8px;background:rgba(232,19,58,.14);border:1px solid rgba(232,19,58,.35);color:var(--red);font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s}
.cal-today-btn:hover{background:var(--red);color:#fff;border-color:var(--red)}
/* toggle view pill */
.cal-view-toggle{display:flex;background:var(--bg3);border:1px solid var(--brd);border-radius:50px;padding:3px;gap:2px}
.cvt{padding:5px 13px;border-radius:50px;font-size:.76rem;font-weight:600;cursor:pointer;color:var(--txt2);transition:all .2s}
.cvt.on{background:var(--red);color:#fff}

/* Grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--brd);border:1px solid var(--brd);border-radius:14px;overflow:hidden}
.cal-dow{background:var(--bg2);padding:11px 0;text-align:center;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--txt3)}
.cal-day{background:var(--bg2);padding:8px;min-height:110px;cursor:pointer;transition:background .18s;position:relative;vertical-align:top}
.cal-day:hover{background:var(--bg3)}
.cal-day.cal-today{background:rgba(232,19,58,.07)!important}
.cal-day.cal-today .cal-day-n{background:var(--red);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cal-day.cal-other{opacity:.35}
.cal-day.cal-sel{background:rgba(232,19,58,.13)!important;outline:2px solid rgba(232,19,58,.45);outline-offset:-2px}
.cal-day-n{font-size:.8rem;font-weight:600;color:var(--txt2);margin-bottom:5px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal-items{display:flex;flex-wrap:wrap;gap:3px}
.cal-item{position:relative;cursor:pointer;border-radius:4px;overflow:hidden;flex-shrink:0;transition:transform .2s;width:30px;height:43px}
.cal-item:hover{transform:scale(1.12);z-index:5}
.cal-item img{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg3)}
.cal-item-ty{position:absolute;bottom:0;left:0;right:0;height:2px}
.cal-item-ty.mov{background:var(--red)}.cal-item-ty.tv{background:#3b82f6}
.cal-more{font-size:.6rem;color:var(--txt3);font-weight:700;padding:2px 5px;background:var(--bg4);border-radius:4px;border:1px solid var(--brd);align-self:flex-end;cursor:pointer}

/* Day detail panel */
.cal-detail{margin-top:20px;background:var(--bg2);border:1px solid var(--brd);border-radius:16px;overflow:hidden;animation:fi .3s var(--ease)}
.cal-det-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--brd)}
.cal-det-date{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.04em}
.cal-det-count{font-size:.8rem;color:var(--txt2)}
.cal-det-close{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:1.1rem;padding:4px;transition:color .2s}.cal-det-close:hover{color:var(--red)}
.cal-releases{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:18px 22px}
.cal-release{display:flex;gap:13px;background:var(--bg3);border:1px solid var(--brd);border-radius:12px;padding:13px;cursor:pointer;transition:all .22s}
.cal-release:hover{border-color:var(--red);background:rgba(232,19,58,.06);transform:translateY(-2px)}
.cal-rel-pw{position:relative;flex-shrink:0}
.cal-rel-p{width:68px;height:102px;border-radius:8px;object-fit:cover;background:var(--bg2);display:block}
.cal-rel-badge{position:absolute;top:4px;left:4px;font-size:.54rem;font-weight:800;text-transform:uppercase;padding:2px 5px;border-radius:3px}
.cal-rel-badge.mov{background:var(--red);color:#fff}.cal-rel-badge.tv{background:#3b82f6;color:#fff}
.cal-rel-info{flex:1;min-width:0}
.cal-rel-title{font-size:.88rem;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-rel-rat{font-size:.74rem;color:var(--gold);margin-bottom:5px;display:flex;align-items:center;gap:3px}
.cal-rel-date{font-size:.7rem;color:var(--txt3);margin-bottom:5px}
.cal-rel-ov{font-size:.73rem;color:var(--txt2);line-height:1.54;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cal-empty{text-align:center;padding:32px;color:var(--txt3);font-size:.84rem;font-style:italic}
.cal-hint{text-align:center;padding:24px;color:var(--txt3);font-size:.83rem;font-style:italic;margin-top:16px}

/* List view */
.cal-list-day{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;margin-bottom:12px;overflow:hidden}
.cal-list-day-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(232,19,58,.06);border-bottom:1px solid var(--brd)}
.cal-list-date-num{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1;color:var(--red);width:36px;flex-shrink:0;text-align:center}
.cal-list-date-info{flex:1}.cal-list-dow{font-size:.68rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em}
.cal-list-full{font-size:.82rem;font-weight:600}
.cal-list-cnt{font-size:.72rem;color:var(--txt2);background:var(--bg3);border:1px solid var(--brd);padding:2px 9px;border-radius:50px}
.cal-list-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;padding:14px 18px}

/* Episode calendar item */
.cal-ep-item{position:relative;cursor:pointer;border-radius:4px;overflow:hidden;flex-shrink:0;transition:transform .2s;width:30px;height:43px;outline:2px solid rgba(59,130,246,.6)}
.cal-ep-item:hover{transform:scale(1.12);z-index:5}
.cal-ep-item img{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg3)}
.cal-ep-item-ty{position:absolute;bottom:0;left:0;right:0;height:2px;background:#3b82f6}

/* ── TV SCHEDULE VIEW ── */
.sched-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sched-nav-btn{padding:6px 14px;border-radius:50px;font-size:.78rem;font-weight:600;cursor:pointer;background:var(--bg3);border:1px solid var(--brd);color:var(--txt2);transition:all .2s;white-space:nowrap}
.sched-nav-btn:hover,.sched-nav-btn.on{background:rgba(232,19,58,.13);border-color:rgba(232,19,58,.4);color:var(--red)}
.sched-nav-btn.today{background:var(--red);border-color:var(--red);color:#fff}
.sched-days{display:flex;border-bottom:2px solid var(--brd);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.sched-days::-webkit-scrollbar{display:none}
.sched-day-tab{flex:1;min-width:58px;padding:10px 6px;text-align:center;cursor:pointer;position:relative;color:var(--txt2);transition:color .2s}
.sched-day-tab::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:#3b82f6;transform:scaleX(0);transition:transform .22s}
.sched-day-tab:hover{color:var(--txt)}
.sched-day-tab.sel{color:var(--txt)}.sched-day-tab.sel::after{transform:scaleX(1)}
.sched-day-tab.today-tab .sd-num{background:var(--red);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;margin:2px auto 0}
.sd-dow{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);margin-bottom:2px}
.sched-day-tab.sel .sd-dow{color:#60a5fa}
.sd-num{font-size:1rem;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.sd-cnt{font-size:.58rem;color:var(--red);font-weight:700;margin-top:3px}
/* Time groups */
.sched-grp{border-bottom:1px solid var(--brd)}
.sched-grp-hd{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;user-select:none}
.sched-grp-ico{font-size:.75rem;color:var(--txt3);transition:transform .2s;display:inline-block}
.sched-grp-ico.open{transform:rotate(90deg)}
.sched-grp-lbl{font-size:.82rem;font-weight:800;color:var(--txt);letter-spacing:.04em}
.sched-grp-cnt{font-size:.68rem;color:var(--txt3);padding:2px 8px;background:var(--bg3);border-radius:50px;border:1px solid var(--brd)}
.sched-ep-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:7px;padding-bottom:12px}
.sched-ep-card{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--brd);border-radius:10px;padding:9px 12px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.sched-ep-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#3b82f6}
.sched-ep-card:hover{border-color:#3b82f6;background:rgba(59,130,246,.07);transform:translateX(2px)}
.sched-ep-poster{width:36px;height:54px;border-radius:5px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.sched-ep-still{width:80px;height:46px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.sched-ep-body{flex:1;min-width:0}
.sched-ep-show{font-size:.72rem;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.sched-ep-name{font-size:.84rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.sched-ep-num{font-size:.69rem;color:#60a5fa;font-weight:700}
.sched-empty{text-align:center;padding:48px 20px;color:var(--txt3);font-size:.85rem;font-style:italic}

/* ── RESUME BUTTON (Continue Watching) ── */
.player-pos-wrap{position:relative}
.resume-btn{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  z-index:30;background:rgba(8,8,14,.94);border:1px solid rgba(232,19,58,.45);
  border-radius:14px;overflow:hidden;min-width:270px;max-width:370px;
  box-shadow:0 10px 36px rgba(0,0,0,.8);
  animation:rIn .4s var(--spring) both;cursor:pointer;
}
@keyframes rIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.resume-inner{display:flex;align-items:center;gap:11px;padding:12px 15px}
.resume-inner:hover .resume-txt{color:var(--red)}
.resume-play-ico{width:30px;height:30px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.8rem}
.resume-txt{flex:1;font-size:.83rem;font-weight:600;color:var(--txt);line-height:1.3}
.resume-dismiss{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--txt3);flex-shrink:0;transition:all .18s}
.resume-dismiss:hover{background:rgba(232,19,58,.3);color:var(--red)}
.resume-bar{height:2px;background:rgba(255,255,255,.07)}
.resume-bar-fill{height:100%;background:var(--grad);transition:width 1s linear}
/* Episode detail card */
.cal-ep-card{display:flex;gap:13px;background:var(--bg3);border:1px solid rgba(59,130,246,.22);border-radius:12px;padding:13px;cursor:pointer;transition:all .22s}
.cal-ep-card:hover{border-color:#3b82f6;background:rgba(59,130,246,.07);transform:translateY(-2px)}
.cal-ep-pw{position:relative;flex-shrink:0}
.cal-ep-poster{width:60px;height:90px;border-radius:8px;object-fit:cover;background:var(--bg2);display:block}
.cal-ep-still{width:140px;height:80px;border-radius:6px;object-fit:cover;background:var(--bg2);display:block;margin-top:6px}
.cal-ep-badge{position:absolute;top:4px;left:4px;font-size:.52rem;font-weight:800;text-transform:uppercase;padding:2px 5px;border-radius:3px;background:#3b82f6;color:#fff}
.cal-ep-info{flex:1;min-width:0}
.cal-ep-show{font-size:.78rem;color:var(--txt3);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
'use strict';
/* ─── CONFIG ───────────────────────────────────────────── */
const KEY='34d1a1bd431dc14e9243d534340f360b';
const BASE='https://api.themoviedb.org/3';
const IMGB='https://image.tmdb.org/t/p';
const VK='https://www.vidking.net/embed';
const VCOL='e8133a';

/* ─── STATE ────────────────────────────────────────────── */
const ST={
  page:'home',id:null,type:null,season:1,ep:1,query:'',
  genre:null,genreName:'',
  _navStack:[],
  favIds:new Set(lsGet('bsz-fi',[])),
  favData:lsGet('bsz-fd',[]),
  progress:lsGet('bsz-pr',{}),
  recent:lsGet('bsz-rc',[]),
  heroItems:[],heroIdx:0,heroTick:null,heroPaused:false,
  movCat:'popular',movPg:1,movItems:[],movLd:false,
  tvCat:'popular',tvPg:1,tvItems:[],tvLd:false,
  calYear:new Date().getFullYear(),calMonth:new Date().getMonth(),
  calData:{},calEpData:{},calSel:null,calView:'month',calMode:'releases',
  calSchedOffset:0,calSchedDay:null,calSchedData:{},
  _fromCW:false,
};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

/* ─── API CACHE ─────────────────────────────────────────── */
const C=new Map();
async function api(ep,p={}){
  const u=new URL(BASE+ep);u.searchParams.set('api_key',KEY);
  for(const[k,v]of Object.entries(p))u.searchParams.set(k,v);
  const key=u.toString();if(C.has(key))return C.get(key);
  const r=await fetch(u);if(!r.ok)throw new Error(r.status);
  const d=await r.json();
  if(C.size>300)C.delete(C.keys().next().value);C.set(key,d);return d;
}
const A={
  trending:(t='all',w='week')=>api(`/trending/${t}/${w}`),
  popular:(t,pg=1)=>api(`/${t}/popular`,{page:pg}),
  topRated:(t,pg=1)=>api(`/${t}/top_rated`,{page:pg}),
  nowPlay:(pg=1)=>api('/movie/now_playing',{page:pg}),
  upcoming:(pg=1)=>api('/movie/upcoming',{page:pg}),
  onAir:(pg=1)=>api('/tv/on_the_air',{page:pg}),
  airToday:(pg=1)=>api('/tv/airing_today',{page:pg}),
  search:(q,pg=1)=>api('/search/multi',{query:q,page:pg}),
  detail:(id,t)=>api(`/${t}/${id}`,{append_to_response:'credits,videos,similar,recommendations'}),
  season:(id,s)=>api(`/tv/${id}/season/${s}`),
  byGenre:(t,gid,pg=1)=>api(`/discover/${t}`,{with_genres:gid,sort_by:'popularity.desc',page:pg}),
  genres:(t)=>api(`/genre/${t}/list`),
  paged:(t,cat,pg=1)=>api(`/${t}/${cat}`,{page:pg}),
  collection:(id)=>api(`/collection/${id}`),
  discover:(t,p)=>api(`/discover/${t}`,p),
  tvDetail:(id)=>api(`/tv/${id}`),
};

/* ─── HELPERS ───────────────────────────────────────────── */
const gt=i=>i?.title||i?.name||'Untitled',grd=i=>i?.release_date||i?.first_air_date||'',
  mty=i=>i?.media_type||(i?.title?'movie':'tv'),
  yr=d=>d?new Date(d).getFullYear():'',
  fd=d=>d?new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'',
  fr=r=>r?(+r).toFixed(1):'N/A',
  frt=m=>!m?'':Math.floor(m/60)>0?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`;
const IM={
  p:(p,sz='w342')=>p?`${IMGB}/${sz}${p}`:`https://placehold.co/342x513/181826/555?text=?`,
  b:(p,sz='w1280')=>p?`${IMGB}/${sz}${p}`:null,
  s:(p)=>p?`${IMGB}/w300${p}`:`https://placehold.co/300x170/181826/555?text=Ep`,
  f:(p)=>p?`${IMGB}/w185${p}`:`https://placehold.co/185x185/181826/555?text=?`,
};
const REG=new Map();
function regItem(i){const t=mty(i);const s={...i,media_type:t,_mtype:t};REG.set(i.id,s);return s}
function getItem(id){return REG.get(+id)}

/* ─── FAVORITES (localStorage only) ────────────────────── */
function isFav(id){return ST.favIds.has(+id)}
function toggleFav(id){
  id=+id;const item=getItem(id);
  if(!item){
    // fallback search in favData and recent
    const fb=ST.favData.find(f=>f.id===id)||ST.recent.find(r=>r.id===id);
    if(fb)regItem(fb);else return;
  }
  const it=getItem(id);
  if(isFav(id)){
    ST.favIds.delete(id);ST.favData=ST.favData.filter(f=>f.id!==id);
    toast('Removed from Watchlist');
  }else{
    ST.favIds.add(id);ST.favData.unshift(it);
    toast('Added to Watchlist ❤️','ok');
  }
  lsSet('bsz-fi',[...ST.favIds]);lsSet('bsz-fd',ST.favData);
  document.querySelectorAll(`[data-fid="${id}"]`).forEach(b=>{
    b.classList.toggle('saved',isFav(id));
    b.innerHTML=isFav(id)?I.bmS:I.bm;
  });
  if(ST.page==='favorites'&&!isFav(id)){
    const card=document.querySelector(`[data-card-id="${id}"]`);
    if(card){card.style.transition='opacity .25s,transform .25s';card.style.opacity='0';card.style.transform='scale(.85)';
      setTimeout(()=>{card.remove();const sub=document.querySelector('#main .pg-sub');if(sub)sub.textContent=`${ST.favData.length} title${ST.favData.length!==1?'s':''} saved`;},280);}
  }
}
window.toggleFav=toggleFav;
function addRecent(item){ST.recent=ST.recent.filter(r=>r.id!==item.id);ST.recent.unshift(item);if(ST.recent.length>24)ST.recent.pop();lsSet('bsz-rc',ST.recent)}
function getProg(id){return ST.progress[+id]||null}
function saveProg(id,type,pct,s,ep){ST.progress[+id]={type,pct:Math.min(pct,100),s,ep,ts:Date.now()};lsSet('bsz-pr',ST.progress)}
function removeRecent(id){id=+id;ST.recent=ST.recent.filter(r=>r.id!==id);lsSet('bsz-rc',ST.recent);const el=document.getElementById(`rec-${id}`);if(el){el.style.transition='opacity .25s,transform .25s';el.style.opacity='0';el.style.transform='scale(.85)';setTimeout(()=>{el.remove();const row=document.getElementById('row_rc');if(row&&!row.children.length){const sec=row.closest('.section');if(sec)sec.remove()}},280)}toast('Removed from Recently Viewed')}
function removeCW(id){id=+id;delete ST.progress[id];lsSet('bsz-pr',ST.progress);const el=document.getElementById(`cw-${id}`);if(el){el.style.transition='opacity .25s,transform .25s';el.style.opacity='0';el.style.transform='scale(.85)';setTimeout(()=>{el.remove();const row=document.getElementById('row_cw');if(row&&!row.children.length){const sec=row.closest('.section');if(sec)sec.remove()}},280)}toast('Removed from Continue Watching')}
window.removeRecent=removeRecent;window.removeCW=removeCW;
function toast(msg,cls='info',ms=3000){const w=document.getElementById('toasts');const el=document.createElement('div');el.className=`toast ${cls}`;el.innerHTML=`<span>${cls==='ok'?'✅':cls==='err'?'❌':'ℹ️'}</span><span>${msg}</span>`;w.appendChild(el);setTimeout(()=>{el.style.animation='tin .28s reverse both';setTimeout(()=>el.remove(),300)},ms)}

/* ─── ICONS ─────────────────────────────────────────────── */
const I={
  play:`<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`,
  pF:`<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`,
  info:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  star:`<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,
  bm:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  bmS:`<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  heart:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
  chL:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>`,
  chR:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`,
  menu:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>`,
  home:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  film:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>`,
  tv:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>`,
  trend:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
  cal:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  genre:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`,
  wl:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  pause:`<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
  srch:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  clk:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  lyr:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`,
};

/* ─── PAGES ─────────────────────────────────────────────── */
const PAGES=[
  {id:'home',label:'Home',icon:I.home},
  {id:'movies',label:'Movies',icon:I.film},
  {id:'tv',label:'TV Shows',icon:I.tv},
  {id:'trending',label:'Trending',icon:I.trend},
  {id:'calendar',label:'Calendar',icon:I.cal},
  {id:'genres',label:'Genres',icon:I.genre},
  {id:'favorites',label:'Watchlist',icon:I.wl},
];
const PAGE_TITLES={home:'BEBU Streaming Zone',movies:'Movies · BEBU',tv:'TV Shows · BEBU',trending:'Trending · BEBU',calendar:'Calendar · BEBU',genres:'Genres · BEBU',favorites:'Watchlist · BEBU',search:'Search · BEBU',detail:'Details · BEBU',watch:'Watch · BEBU'};

/* ─── NAVIGATION ────────────────────────────────────────── */
function go(page,opts={}){
  const snap={page:ST.page,id:ST.id,type:ST.type,season:ST.season,ep:ST.ep,query:ST.query,genre:ST.genre,genreName:ST.genreName};
  const last=ST._navStack[ST._navStack.length-1];
  if(!(last&&last.page===snap.page&&last.id===snap.id)){ST._navStack.push(snap);if(ST._navStack.length>30)ST._navStack.shift()}
  ST.page=page;
  if(opts.id!==undefined)ST.id=+opts.id;if(opts.type!==undefined)ST.type=opts.type;
  if(opts.season!==undefined)ST.season=+opts.season;if(opts.ep!==undefined)ST.ep=+opts.ep;
  if(opts.query!==undefined)ST.query=opts.query;if(opts.genre!==undefined)ST.genre=+opts.genre;
  if(opts.genreName!==undefined)ST.genreName=opts.genreName;
  clearHeroTimer();closeDrop();closeDrawer();
  window.scrollTo({top:0,behavior:'smooth'});
  document.title=PAGE_TITLES[page]||'BEBU Streaming Zone';
  if(window._progressTimer){clearInterval(window._progressTimer);window._progressTimer=null}
  if(window._msgHandler){window.removeEventListener('message',window._msgHandler);window._msgHandler=null}
  renderNav();renderPage();
}
window.go=go;
function goBack(){const prev=ST._navStack.pop();if(!prev){go('home');return}ST.page=prev.page;ST.id=prev.id;ST.type=prev.type;ST.season=prev.season;ST.ep=prev.ep;ST.query=prev.query;ST.genre=prev.genre;ST.genreName=prev.genreName;clearHeroTimer();closeDrop();closeDrawer();window.scrollTo({top:0,behavior:'smooth'});document.title=PAGE_TITLES[ST.page]||'BEBU Streaming Zone';renderNav();renderPage()}
window.goBack=goBack;
document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName?.toLowerCase();if(tag==='input'||tag==='textarea')return;if(e.key==='Escape'){closeTrailer();closeDrawer();if(ST.page==='detail'||ST.page==='watch')goBack()}});

/* ─── RENDER NAV ────────────────────────────────────────── */
function renderNav(){
  const nb=document.getElementById('nb');if(!nb)return;
  nb.innerHTML=`
    <div class="logo" onclick="go('home')">BEBU<span style="-webkit-text-fill-color:rgba(240,240,255,.42)">_</span>STREAMING</div>
    <ul class="nav-links">
      ${PAGES.map(p=>`<li><a class="${ST.page===p.id?'on':''}" onclick="go('${p.id}')">${p.label}</a></li>`).join('')}
    </ul>
    <div class="srch-wrap">
      <span class="srch-ico">${I.srch}</span>
      <input id="srch-inp" type="text" placeholder="Search movies, shows…" autocomplete="off" value="${ST.query||''}"/>
      <div id="sdrop"></div>
    </div>
    <button class="nav-hbg" onclick="openDrawer()">${I.menu}</button>
  `;
  const inp=document.getElementById('srch-inp');
  if(inp){
    inp.addEventListener('input',e=>{clearTimeout(window._srchT);const q=e.target.value.trim();if(!q){closeDrop();return}window._srchT=setTimeout(async()=>{if(q.length<2)return;try{const d=await A.search(q,1);const items=d.results.filter(i=>i.media_type!=='person'&&i.poster_path&&(i.title||i.name)).slice(0,6);showDrop(items,q)}catch{}},380)});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){go('search',{query:e.target.value.trim()});closeDrop()}if(e.key==='Escape')closeDrop()});

/* ─── QUALITY BADGE ─────────────────────────────────────── */
function qualBadge(item){
  const t=mty(item);if(t==='tv')return`<span class="card-qual qual-hd">HD</span>`;
  const rel=item.release_date||'';if(!rel)return`<span class="card-qual qual-hd">HD</span>`;
  const d=(Date.now()-new Date(rel))/86400000;
  if(d<0) return`<span class="card-qual qual-new">SOON</span>`;
  if(d<35) return`<span class="card-qual qual-cam">CAM</span>`;
  if(d<90) return`<span class="card-qual qual-new">NEW</span><span class="card-qual qual-hd">HD</span>`;
  return`<span class="card-qual qual-hd">HD</span>`;
}
function qualLabel(item){
  const t=mty(item);if(t==='tv')return[{label:'HD',cls:'qual-hd'}];
  const rel=item.release_date||'';if(!rel)return[{label:'HD',cls:'qual-hd'}];
  const d=(Date.now()-new Date(rel))/86400000;
  if(d<0) return[{label:'SOON',cls:'qual-new'}];
  if(d<35) return[{label:'CAM',cls:'qual-cam'}];
  if(d<90) return[{label:'NEW',cls:'qual-new'},{label:'HD',cls:'qual-hd'}];
  return[{label:'HD',cls:'qual-hd'}];
}

async function filtMov(cat){ST.movCat=cat;ST.movPg=1;ST.movItems=[];document.querySelectorAll('[data-mc]').forEach(f=>f.classList.toggle('on',f.dataset.mc===cat));const g=document.getElementById('mov-grid');if(g)g.innerHTML=skelGrid();const btn=document.getElementById('mov-more');if(btn)btn.style.display='none';await loadMovs()}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS_SHORT=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

async function pageCalendar(){
  const main=document.getElementById('main');
  main.innerHTML=`<div class="spin-wrap"><div class="spinner"></div></div>`;
  await fetchCalendar(ST.calYear,ST.calMonth);
}

function calViewRange(year,month){
  const firstOfMonth=new Date(year,month,1),lastOfMonth=new Date(year,month+1,0);
  const viewStart=new Date(firstOfMonth);viewStart.setDate(viewStart.getDate()-((viewStart.getDay()+6)%7));
  const viewEnd=new Date(lastOfMonth);const dowEnd=viewEnd.getDay();if(dowEnd!==0)viewEnd.setDate(viewEnd.getDate()+(7-dowEnd));
  const toStr=d=>d.toISOString().split('T')[0];
  return{viewStart,viewEnd,start:toStr(viewStart),end:toStr(viewEnd)};
}

async function fetchCalendar(year,month){
  const main=document.getElementById('main');
  const{viewStart,viewEnd,start,end}=calViewRange(year,month);
  if(ST.calMode==='releases'){
    try{
      const[movs,tvs]=await Promise.all([
        A.discover('movie',{'primary_release_date.gte':start,'primary_release_date.lte':end,sort_by:'popularity.desc',page:1}),
        A.discover('tv',{'first_air_date.gte':start,'first_air_date.lte':end,sort_by:'popularity.desc',page:1}),
      ]);
      ST.calData={};
      for(const m of(movs.results||[])){const d=m.release_date;if(d){if(!ST.calData[d])ST.calData[d]=[];ST.calData[d].push(regItem({...m,media_type:'movie'}))}}
      for(const t of(tvs.results||[])){const d=t.first_air_date;if(d){if(!ST.calData[d])ST.calData[d]=[];ST.calData[d].push(regItem({...t,media_type:'tv'}))}}
      Object.values(ST.calData).forEach(arr=>arr.sort((a,b)=>(b.popularity||0)-(a.popularity||0)));
    }catch(e){console.warn('[Cal releases]',e)}
    main.innerHTML=renderCalPage(year,month,viewStart,viewEnd);
  }else{
    // schedule mode — weekly TV episode schedule
    main.innerHTML=renderCalShell(year,month);
    const{monday}=await fetchSchedule(ST.calSchedOffset);
    const area=document.getElementById('sched-area');
    if(area)area.innerHTML=renderScheduleView(monday);
  }
}

async function fetchEpisodes(start,end){
  // Get popular shows airing in this window
  try{
    const[p1,p2]=await Promise.all([
      A.discover('tv',{'air_date.gte':start,'air_date.lte':end,sort_by:'popularity.desc',page:1}),
      A.discover('tv',{'air_date.gte':start,'air_date.lte':end,sort_by:'popularity.desc',page:2}),
    ]);
    const shows=[...p1.results,...p2.results].slice(0,25);
    // Fetch full TV details for each show to get next/last episode dates and current seasons
    const details=await Promise.allSettled(shows.map(s=>A.tvDetail(s.id)));
    ST.calEpData={};
    const startTs=new Date(start).getTime(),endTs=new Date(end).getTime();
    for(let i=0;i<details.length;i++){
      if(details[i].status!=='fulfilled')continue;
      const det=details[i].value,show=shows[i];
      // Fetch the airing season's episode list for exact per-episode dates
      const season=det.next_episode_to_air?.season_number||det.last_episode_to_air?.season_number;
      if(!season)continue;
      try{
        const sd=await A.season(det.id,season);
        for(const ep of(sd.episodes||[])){
          if(!ep.air_date)continue;
          const epTs=new Date(ep.air_date).getTime();
          if(epTs<startTs||epTs>endTs)continue;
          if(!ST.calEpData[ep.air_date])ST.calEpData[ep.air_date]=[];
          ST.calEpData[ep.air_date].push({
            _epItem:true,
            showId:det.id,showName:gt(det),
            showPoster:show.poster_path,
            backdrop:show.backdrop_path,
            epName:ep.name||`Episode ${ep.episode_number}`,
            epNum:ep.episode_number,
            epSeason:season,
            epStill:ep.still_path,
            epOverview:ep.overview||'',
            popularity:det.popularity||0,
            vote_average:det.vote_average,
            id:det.id,media_type:'tv',
          });
        }
      }catch{}
    }
    // Sort each day by show popularity
    Object.values(ST.calEpData).forEach(arr=>arr.sort((a,b)=>(b.popularity||0)-(a.popularity||0)));
  }catch(e){console.warn('[Cal episodes]',e)}
}

function renderCalPage(year,month,viewStart,viewEnd){
  const today=new Date().toISOString().split('T')[0];
  const data=ST.calData;
  const weeks=[];let cur=new Date(viewStart);
  while(cur<=viewEnd){const week=[];for(let d=0;d<7;d++){week.push(new Date(cur));cur.setDate(cur.getDate()+1)}weeks.push(week)}

  const dayCells=weeks.map(week=>week.map(day=>{
    const ds=day.toISOString().split('T')[0];
    const isToday=ds===today,isOther=day.getMonth()!==month,isSel=ds===ST.calSel;
    const rels=data[ds]||[];
    const show=rels.slice(0,4),more=rels.length-show.length;
    return`<div class="cal-day${isToday?' cal-today':''}${isOther?' cal-other':''}${isSel?' cal-sel':''}" onclick="calSelDay('${ds}')">
      <div class="cal-day-n">${day.getDate()}</div>
      <div class="cal-items">
        ${show.map(item=>`<div class="cal-item" onclick="event.stopPropagation();go('detail',{id:${item.id},type:'${item.media_type}'})" title="${gt(item).replace(/"/g,'')}">
          <img src="${IM.p(item.poster_path,'w92')}" loading="lazy" onerror="this.style.background='var(--bg4)'"/>
          <div class="cal-item-ty ${item.media_type==='tv'?'tv':'mov'}"></div>
        </div>`).join('')}
        ${more>0?`<div class="cal-more" onclick="event.stopPropagation();calSelDay('${ds}')">+${more}</div>`:''}
      </div>
    </div>`}).join('')).join('');

  const modeToggle=`<div class="cal-mode-toggle">
    <div class="cmt releases on">🎬 Releases</div>
    <div class="cmt" onclick="setCalMode('schedule')">📺 TV Schedule</div>
  </div>`;

  return`<div class="fi">
<div class="cal-top-hd">
  <div class="pg-title">📅 Release Calendar</div>
  <div class="pg-sub">Upcoming movies and TV series premieres — click any day to see details</div>
</div>
<div class="cal-wrap">
  <div class="cal-hd">
    <button class="cal-nb" onclick="calPrev()">◀</button>
    <div class="cal-month"><span>${MONTHS[month]}</span> ${year}</div>
    <button class="cal-nb" onclick="calNext()">▶</button>
    <button class="cal-today-btn" onclick="calToday()">Today</button>
    ${modeToggle}
    <div class="cal-view-toggle">
      <div class="cvt${ST.calView==='month'?' on':''}" onclick="setCalView('month')">Month</div>
      <div class="cvt${ST.calView==='list'?' on':''}" onclick="setCalView('list')">List</div>
    </div>
  </div>
  ${ST.calView==='month'?`
  <div class="cal-grid">
    ${DAYS_SHORT.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${dayCells}
  </div>
  ${ST.calSel?renderDayDetail(ST.calSel):'<div class="cal-hint">💡 Click any day to see what\'s releasing</div>'}
  `:renderListView(viewStart,viewEnd,month,false)}
</div>
${ftHTML()}</div>`;
}

function renderListView(viewStart,viewEnd,month,isEp){
  const data=isEp?ST.calEpData:ST.calData;
  const items=[];let cur=new Date(viewStart);
  while(cur<=viewEnd){
    const ds=cur.toISOString().split('T')[0];
    if(cur.getMonth()===month){const rels=data[ds]||[];if(rels.length)items.push({ds,rels,day:new Date(cur)})}
    cur.setDate(cur.getDate()+1);
  }
  if(!items.length)return`<div class="cal-empty" style="padding:60px 0">No ${isEp?'episode airings':'releases'} found this month.</div>`;
  return items.map(({ds,rels,day})=>`

  <div class="cal-list-day-hd">
    <div class="cal-list-date-num">${day.getDate()}</div>
    <div class="cal-list-date-info"><div class="cal-list-dow">${day.toLocaleDateString('en-US',{weekday:'long'})}</div><div class="cal-list-full">${day.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div></div>
    <span class="cal-list-cnt">${rels.length} ${isEp?'episode':'release'}${rels.length!==1?'s':''}</span>
  </div>
  <div class="cal-list-items">
    ${isEp?rels.map(ep=>`<div class="cal-ep-card" onclick="go('detail',{id:${ep.showId},type:'tv'})">
      <div class="cal-ep-pw"><img class="cal-ep-poster" src="${IM.p(ep.showPoster,'w342')}" loading="lazy" onerror="this.src='https://placehold.co/342x513/181826/555?text=?'"/><span class="cal-ep-badge">EP</span></div>
      <div class="cal-ep-info"><div class="cal-ep-show">${ep.showName}</div><div class="cal-ep-num">S${ep.epSeason} · E${ep.epNum}</div><div class="cal-ep-title">${ep.epName}</div><div class="cal-ep-ov">${ep.epOverview}</div></div>
    </div>`).join(''):rels.map(item=>`<div class="cal-release" onclick="go('detail',{id:${item.id},type:'${item.media_type}'})">
      <div class="cal-rel-pw"><img class="cal-rel-p" src="${IM.p(item.poster_path,'w342')}" loading="lazy" onerror="this.src='https://placehold.co/342x513/181826/555?text=?'"/><span class="cal-rel-badge ${item.media_type==='tv'?'tv':'mov'}">${item.media_type==='tv'?'TV':'FILM'}</span></div>

    </div>`).join('')}

function calSelDay(ds){ST.calSel=ST.calSel===ds?null:ds;const main=document.getElementById('main');if(main)main.innerHTML=renderCalPage(ST.calYear,ST.calMonth,...Object.values(calViewRange(ST.calYear,ST.calMonth)).slice(0,2))}

function calNext(){ST.calMonth++;if(ST.calMonth>11){ST.calMonth=0;ST.calYear++}ST.calSel=null;fetchCalendar(ST.calYear,ST.calMonth)}
function calToday(){const n=new Date();ST.calYear=n.getFullYear();ST.calMonth=n.getMonth();ST.calSel=n.toISOString().split('T')[0];fetchCalendar(ST.calYear,ST.calMonth)}
function setCalView(v){ST.calView=v;fetchCalendar(ST.calYear,ST.calMonth)}
function setCalMode(m){ST.calMode=m;ST.calSel=null;fetchCalendar(ST.calYear,ST.calMonth)}
window.calSelDay=calSelDay;window.calPrev=calPrev;window.calNext=calNext;window.calToday=calToday;window.setCalView=setCalView;window.setCalMode=setCalMode;

  if(!q){document.getElementById('sr-grid').innerHTML=emptyState('🔍','Start Searching','Type in the search bar to discover movies and TV shows');return}

/* PROGRESS TRACKER */
function setupProgressTracker(id,type,totalMins){
  if(window._progressTimer)clearInterval(window._progressTimer);
  if(window._msgHandler){window.removeEventListener('message',window._msgHandler);window._msgHandler=null}
  const totalSecs=totalMins*60;let watchedSecs=0;
  window._progressTimer=setInterval(()=>{
    watchedSecs+=15;const pct=Math.min((watchedSecs/totalSecs)*100,99);
    if(pct>2)saveProg(id,type,pct,ST.season,ST.ep);
  },15000);
  const msgH=evt=>{if(typeof evt.data!=='string')return;try{const d=JSON.parse(evt.data);if(d?.type==='PLAYER_EVENT'&&d.data?.progress>2){clearInterval(window._progressTimer);saveProg(id,type,d.data.progress,d.data.season||ST.season,d.data.episode||ST.ep)}}catch{}};
  window._msgHandler=msgH;window.addEventListener('message',msgH);
}

function clearResumeBtn(){
  if(window._resumeCountdown){clearInterval(window._resumeCountdown);window._resumeCountdown=null}
  const btn=document.getElementById('resume-btn');
  if(btn){btn.style.opacity='0';btn.style.transition='opacity .4s';setTimeout(()=>btn.remove(),420)}
}

/* ═══════════════════════════════════════════════
   TV SCHEDULE FUNCTIONS
═══════════════════════════════════════════════ */
function schedWeekRange(offset){
  const now=new Date();
  const dow=now.getDay(); // 0=Sun
  const monday=new Date(now);
  monday.setDate(now.getDate()-((dow+6)%7)+offset*7);
  monday.setHours(0,0,0,0);
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);sunday.setHours(23,59,59,999);
  const toStr=d=>d.toISOString().split('T')[0];
  return{monday,sunday,start:toStr(monday),end:toStr(sunday)};
}

async function fetchSchedule(offset){
  const{monday,start,end,sunday}=schedWeekRange(offset);
  ST.calSchedData={};
  try{
    const[p1,p2]=await Promise.all([
      A.discover('tv',{'air_date.gte':start,'air_date.lte':end,sort_by:'popularity.desc',page:1}),
      A.discover('tv',{'air_date.gte':start,'air_date.lte':end,sort_by:'popularity.desc',page:2}),
    ]);
    const shows=[...p1.results,...p2.results].slice(0,25);
    const details=await Promise.allSettled(shows.map(s=>A.tvDetail(s.id)));
    const startTs=new Date(start).getTime()-1,endTs=new Date(end).getTime()+86400000;
    for(let i=0;i<details.length;i++){
      if(details[i].status!=='fulfilled')continue;
      const det=details[i].value,show=shows[i];
      const season=det.next_episode_to_air?.season_number||det.last_episode_to_air?.season_number;
      if(!season)continue;
      try{
        const sd=await A.season(det.id,season);
        for(const ep of(sd.episodes||[])){
          if(!ep.air_date)continue;
          const epTs=new Date(ep.air_date).getTime();
          if(epTs<startTs||epTs>endTs)continue;
          if(!ST.calSchedData[ep.air_date])ST.calSchedData[ep.air_date]=[];
          ST.calSchedData[ep.air_date].push({
            showId:det.id,showName:gt(det),
            showPoster:show.poster_path,
            epName:ep.name||`Episode ${ep.episode_number}`,
            epNum:ep.episode_number,epSeason:season,
            epStill:ep.still_path,epOverview:ep.overview||'',
            popularity:det.popularity||0,
          });
        }
      }catch{}
    }
    Object.values(ST.calSchedData).forEach(arr=>arr.sort((a,b)=>(b.popularity||0)-(a.popularity||0)));
  }catch(e){console.warn('[Schedule]',e)}
  return{monday,sunday};
}

function renderScheduleView(monday){
  const today=new Date().toISOString().split('T')[0];
  const offset=ST.calSchedOffset;
  const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  // Build 7 day tabs
  const days=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d});
  // Default select today if in range, else first day with episodes, else monday
  if(!ST.calSchedDay){
    const todayInRange=days.find(d=>d.toISOString().split('T')[0]===today);
    if(todayInRange)ST.calSchedDay=today;
    else{const firstWithEps=days.find(d=>ST.calSchedData[d.toISOString().split('T')[0]]?.length);ST.calSchedDay=firstWithEps?firstWithEps.toISOString().split('T')[0]:days[0].toISOString().split('T')[0]}
  }
  const dayTabs=days.map((d,i)=>{
    const ds=d.toISOString().split('T')[0];
    const isToday=ds===today,isSel=ds===ST.calSchedDay;
    const cnt=(ST.calSchedData[ds]||[]).length;
    return`<div class="sched-day-tab${isSel?' sel':''}${isToday?' today-tab':''}" onclick="schedSelDay('${ds}')">
      <div class="sd-dow">${DOW[i]}</div>
      <div class="sd-num">${d.getDate()}</div>
      ${cnt?`<div class="sd-cnt">${cnt}</div>`:'<div class="sd-cnt" style="color:var(--txt3)">—</div>'}
    </div>`;
  }).join('');

  // Get episodes for selected day
  const eps=ST.calSchedData[ST.calSchedDay]||[];
  // Group by show (no time available from TMDB, so group by letter/alphabetical)
  // Just show as a grid — sorted by popularity (already sorted)
  const epCards=eps.length?`<div class="sched-ep-list">${eps.map(ep=>`
<div class="sched-ep-card" onclick="go('detail',{id:${ep.showId},type:'tv'})">
  ${ep.epStill?`<img class="sched-ep-still" src="${IM.s(ep.epStill)}" loading="lazy" onerror="this.src='https://placehold.co/300x170/181826/555?text=Ep'">`:`<img class="sched-ep-poster" src="${IM.p(ep.showPoster,'w342')}" loading="lazy" onerror="this.src='https://placehold.co/342x513/181826/555?text=?'">`}
  <div class="sched-ep-body">
    <div class="sched-ep-show">${ep.showName}</div>
    <div class="sched-ep-name">${ep.epName}</div>
    <div class="sched-ep-num">Season ${ep.epSeason} · Episode ${ep.epNum}</div>
  </div>
</div>`).join('')}</div>`
  :`<div class="sched-empty">No episode airings found for this day.<br><span style="font-size:.78rem;color:var(--txt3)">Try a different day or check next week.</span></div>`;

  // Week range label
  const wLabel=`${monday.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${days[6].toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;

  return`<div>
<div class="sched-nav">
  <button class="sched-nav-btn" onclick="schedPrev()">◀ Prev Week</button>
  ${offset!==0?`<button class="sched-nav-btn today" onclick="schedToday()">Today</button>`:''}
  <button class="sched-nav-btn" onclick="schedNext()">Next Week ▶</button>
  <span style="font-size:.78rem;color:var(--txt3);margin-left:auto">${wLabel}</span>
</div>
<div class="sched-days">${dayTabs}</div>
<div id="sched-eps">${epCards}</div>
</div>`;
}

function schedSelDay(ds){ST.calSchedDay=ds;const el=document.getElementById('sched-eps');if(el){const eps=ST.calSchedData[ds]||[];el.innerHTML=eps.length?`<div class="sched-ep-list">${eps.map(ep=>`<div class="sched-ep-card" onclick="go('detail',{id:${ep.showId},type:'tv'})">${ep.epStill?`<img class="sched-ep-still" src="${IM.s(ep.epStill)}" loading="lazy" onerror="this.src='https://placehold.co/300x170/181826/555?text=Ep'">`:`<img class="sched-ep-poster" src="${IM.p(ep.showPoster,'w342')}" loading="lazy">`}<div class="sched-ep-body"><div class="sched-ep-show">${ep.showName}</div><div class="sched-ep-name">${ep.epName}</div><div class="sched-ep-num">Season ${ep.epSeason} · Episode ${ep.epNum}</div></div></div>`).join('')}</div>`:`<div class="sched-empty">No episode airings found for this day.</div>`;document.querySelectorAll('.sched-day-tab').forEach(t=>{const d=t.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];t.classList.toggle('sel',d===ds)})}}
async function schedPrev(){ST.calSchedOffset--;ST.calSchedDay=null;await runSchedule()}
async function schedNext(){ST.calSchedOffset++;ST.calSchedDay=null;await runSchedule()}
async function schedToday(){ST.calSchedOffset=0;ST.calSchedDay=null;await runSchedule()}
async function runSchedule(){const main=document.getElementById('main');if(!main)return;const schedArea=document.getElementById('sched-area');if(schedArea)schedArea.innerHTML=`<div class="spin-wrap" style="min-height:200px"><div class="spinner"></div></div>`;const{monday}=await fetchSchedule(ST.calSchedOffset);if(schedArea)schedArea.innerHTML=renderScheduleView(monday)}
window.schedSelDay=schedSelDay;window.schedPrev=schedPrev;window.schedNext=schedNext;window.schedToday=schedToday;
function renderPage(){
  const p=ST.page;
  if(p==='home')return pageHome();if(p==='movies')return pageMovies();if(p==='tv')return pageTV();
  if(p==='trending')return pageTrending();if(p==='calendar')return pageCalendar();
  if(p==='genres')return pageGenres();if(p==='genre')return pageGenreResults();
  if(p==='search')return pageSearch();if(p==='favorites')return pageFavorites();
  if(p==='detail')return pageDetail();if(p==='watch')return pageWatch();
  return pageHome();
}

/* BOOT */
renderNav();
renderPage();
</script>
</body>
</html>
